project:
  type: book
  output-dir: _site
  preview:
    port: 4321
    browser: false
  resources:
    # Nothing links to the social card, so Quarto would not copy it otherwise.
    - figures/social-card.png
    # Quarto copies fonts/fonts.css because it is listed under format.html.css,
    # but not the .woff2 files that stylesheet points at.
    - fonts/*.woff2

book:
  title: "CS231n 2025 Lecture Notes"
  subtitle: "Deep Learning for Computer Vision — Stanford, Spring 2025"
  author: "Murat Raimbekov"
  description: >
    Comprehensive, modern lecture notes for Stanford CS231n (Spring 2025):
    CNNs, Transformers, diffusion models, and vision-language models.
    The official notes stopped at 2017 — these do not.
  site-url: https://raimbekovm.github.io/cs231n-2025-notes/
  repo-url: https://github.com/raimbekovm/cs231n-2025-notes
  repo-branch: main
  repo-actions: [edit, issue]
  search:
    # Two deliberate changes from the default. `textbox` swaps the lone
    # magnifier for a field a reader can see is a field. `navbar` is what makes
    # it exist on a phone at all: with the search in the sidebar it is simply
    # absent below the collapse breakpoint — measured at 0x0, both as an overlay
    # and as a textbox — whereas from the navbar Quarto falls back to a detached
    # full-screen search.
    location: navbar
    type: textbox
    copy-button: false
  sidebar:
    style: docked
    collapse-level: 1
  page-navigation: true
  back-to-top-navigation: true
  navbar:
    right:
      - text: PDF
        href: https://raimbekovm.github.io/cs231n-2025-notes/CS231n-2025-Lecture-Notes.pdf
        aria-label: Download the notes as a PDF
  chapters:
    - index.qmd
    - part: "Fundamentals"
      chapters:
        - lectures/01-introduction.qmd
        - lectures/02-image-classification.qmd

format:
  html:
    theme:
      # theme-common.scss holds type, geometry and every structural rule; the
      # mode files supply only the colour tokens it reads. Dark is listed first
      # because Quarto treats the first entry as the default scheme, and these
      # notes are read at a screen for long stretches.
      dark: [darkly, theme-common.scss, theme-dark.scss]
      light: [cosmo, theme-common.scss, theme.scss]
    # Self-hosted type; see fonts/README.md.
    css: fonts/fonts.css
    toc: true
    toc-depth: 3
    toc-expand: 1
    number-sections: true
    code-copy: true
    link-external-newwindow: true
    fig-align: center
    fig-cap-location: bottom
    # Pinned rather than left to Quarto's default, which is the `katex@latest`
    # tag: the CDN then serves whatever is current, so a KaTeX release could
    # change how the maths on these pages renders without a commit here.
    # 0.18.1 is what `latest` resolved to when this was pinned.
    #
    # The trailing slash is load-bearing: pandoc concatenates this with
    # `katex.min.js` verbatim, so without it the URL comes out as
    # `.../distkatex.min.js` and the maths silently stops rendering.
    html-math-method:
      method: katex
      url: https://cdn.jsdelivr.net/npm/katex@0.18.1/dist/
    anchor-sections: true
    smooth-scroll: true
    # Absolute URLs: the site is served from a subpath, so a root-relative
    # image path would resolve against raimbekovm.github.io instead.
    open-graph:
      image: https://raimbekovm.github.io/cs231n-2025-notes/figures/social-card.png
      locale: en_US
    twitter-card:
      image: https://raimbekovm.github.io/cs231n-2025-notes/figures/social-card.png
      card-style: summary_large_image

  pdf:
    documentclass: scrbook
    papersize: a4
    geometry:
      - margin=1in
    toc: true
    number-sections: true
    colorlinks: true
    fig-cap-location: bottom
    keep-tex: false

# Inputs for filters/seo-metadata.lua, which needs them per page.
seo:
  site-url: https://raimbekovm.github.io/cs231n-2025-notes/
  author-url: https://github.com/raimbekovm
  license-url: https://opensource.org/licenses/MIT
  keywords:
    - computer vision
    - deep learning
    - convolutional neural networks
    - vision transformers
    - diffusion models
    - vision-language models
    - CS231n

filters:
  - at: pre-quarto
    path: filters/seo-metadata.lua
  # Must run after Quarto has built its figure containers: given the image's
  # style attribute earlier, Quarto hoists it onto the enclosing float div,
  # which then constrains the caption as well as the image.
  - at: post-quarto
    path: filters/lazy-images.lua
  # AVIF is what the browser gets; LaTeX cannot read it and would abort the PDF
  # build, so the latex writer is pointed at the JPEG sibling instead.
  - at: post-quarto
    path: filters/pdf-images.lua

crossref:
  fig-title: Figure
  eq-prefix: Equation

# Quarto ships both of these blank or generic, which is most of why the search
# field and the scheme switch read as unexplained chrome.
language:
  search-text-placeholder: "Search the notes…"
  search-no-results-text: "Nothing matches that"
  toggle-dark-mode: "Switch between the dark and light theme"

# Every page inherits these
lightbox: true
