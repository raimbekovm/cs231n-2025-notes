  <title id="captioningTitle">Captioning: a convolutional network's penultimate vector conditioning a recurrence</title>
  <desc id="captioningDesc">On the left a tapering stack of convolutional layers ends in a green bar labelled v, the penultimate layer. A green rail carries v to the right and up into all four steps of the recurrence. Each step also receives the word emitted at the previous step and emits the next one, ending with an end-of-sequence token.</desc>
