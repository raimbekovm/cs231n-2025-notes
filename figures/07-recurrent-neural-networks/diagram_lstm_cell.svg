  <title id="lstmCellTitle">One step of a long short-term memory cell</title>
  <desc id="lstmCellDesc">The cell state runs along the top from left to right, passing through an elementwise multiply by the forget gate and an addition of the gated candidate, with no matrix multiply on it. Below, a single weight matrix W produces four gates f, i, g and o from the stacked previous hidden state and current input. A branch off the cell state passes through tanh and the output gate to become the new hidden state.</desc>
