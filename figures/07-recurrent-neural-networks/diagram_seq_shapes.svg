  <title id="seqShapesTitle">The five input and output shapes a sequence problem can take</title>
  <desc id="seqShapesDesc">Five panels. In each, indigo blocks below are inputs, teal blocks above are outputs, and a grey band between them is the network. One to one has a single input and output; one to many has one input and four outputs; many to one has four inputs and one output; many to many reads two inputs then writes two outputs; the aligned case pairs four inputs with four outputs.</desc>
