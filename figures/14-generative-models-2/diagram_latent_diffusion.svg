<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" width="700" height="340"
     role="img" aria-labelledby="latDiffTitle latDiffDesc" font-family="Source Serif 4, Georgia, serif">
  <title id="latDiffTitle">The latent diffusion pipeline</title>
  <desc id="latDiffDesc">Three panels: an autoencoder trained first and frozen, a diffusion transformer trained on its latents, and the sampling path that ends with a single decoder call.</desc>
  <text x="350.0" y="22.0" font-size="13.5" fill="currentColor" text-anchor="middle" font-weight="600">Compress once, diffuse in the small space</text>
  <rect x="38.0" y="52.0" width="178.0" height="214.0" fill="none" fill-opacity="1.0" stroke="#1b1b1b" stroke-width="1.0" stroke-opacity="0.35" rx="6"/>
  <text x="127.0" y="72.0" font-size="11.5" fill="currentColor" text-anchor="middle" font-weight="600" fill-opacity="0.85">stage 1: autoencoder</text>
  <rect x="66.0" y="88.0" width="122.0" height="34.0" fill="#440154" fill-opacity="0.12" stroke="#440154" stroke-width="1.2" stroke-opacity="1.0" rx="4"/>
  <text x="127.0" y="109.0" font-size="10" fill="#440154" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace">image  1024x1024x3</text>
  <line x1="127.0" y1="122.0" x2="127.0" y2="140.0" stroke="currentColor" stroke-width="1.3" stroke-opacity="0.85"/>
  <polygon points="127.0,146.0 124.3,140.0 129.7,140.0" fill="currentColor" fill-opacity="0.85" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <text x="178.0" y="138.0" font-size="10.5" fill="currentColor" text-anchor="end" fill-opacity="0.85">encoder</text>
  <rect x="66.0" y="148.0" width="122.0" height="34.0" fill="#21918c" fill-opacity="0.14" stroke="#21918c" stroke-width="1.2" stroke-opacity="1.0" rx="4"/>
  <text x="127.0" y="169.0" font-size="10" fill="#21918c" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace">latent  128x128x16</text>
  <line x1="127.0" y1="182.0" x2="127.0" y2="200.0" stroke="currentColor" stroke-width="1.3" stroke-opacity="0.85"/>
  <polygon points="127.0,206.0 124.3,200.0 129.7,200.0" fill="currentColor" fill-opacity="0.85" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <text x="178.0" y="198.0" font-size="10.5" fill="currentColor" text-anchor="end" fill-opacity="0.85">decoder</text>
  <rect x="66.0" y="208.0" width="122.0" height="34.0" fill="#440154" fill-opacity="0.12" stroke="#440154" stroke-width="1.2" stroke-opacity="1.0" rx="4"/>
  <text x="127.0" y="229.0" font-size="10" fill="#440154" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace">reconstruction</text>
  <text x="127.0" y="258.0" font-size="10" fill="currentColor" text-anchor="middle" fill-opacity="0.75">+ discriminator, to keep it sharp</text>
  <line x1="220.0" y1="159.0" x2="256.0" y2="159.0" stroke="currentColor" stroke-width="1.4" stroke-opacity="0.9"/>
  <polygon points="262.0,159.0 256.0,161.7 256.0,156.3" fill="currentColor" fill-opacity="0.9" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <text x="241.0" y="148.0" font-size="10" fill="currentColor" text-anchor="middle" fill-opacity="0.8">freeze</text>
  <rect x="266.0" y="52.0" width="178.0" height="214.0" fill="none" fill-opacity="1.0" stroke="#1b1b1b" stroke-width="1.0" stroke-opacity="0.35" rx="6"/>
  <text x="355.0" y="72.0" font-size="11.5" fill="currentColor" text-anchor="middle" font-weight="600" fill-opacity="0.85">stage 2: diffusion</text>
  <rect x="292.0" y="100.0" width="126.0" height="32.0" fill="#3b528b" fill-opacity="0.14" stroke="#3b528b" stroke-width="1.2" stroke-opacity="1.0" rx="4"/>
  <text x="355.0" y="120.0" font-size="10.5" fill="#3b528b" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace">noisy latent</text>
  <line x1="355.0" y1="132.0" x2="355.0" y2="152.0" stroke="currentColor" stroke-width="1.3" stroke-opacity="0.85"/>
  <polygon points="355.0,158.0 352.3,152.0 357.7,152.0" fill="currentColor" fill-opacity="0.85" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <rect x="292.0" y="160.0" width="126.0" height="32.0" fill="#3b528b" fill-opacity="0.2" stroke="#3b528b" stroke-width="1.3" stroke-opacity="1.0" rx="4"/>
  <text x="355.0" y="180.0" font-size="12" fill="#3b528b" text-anchor="middle" font-weight="600">DiT</text>
  <text x="355.0" y="214.0" font-size="10" fill="currentColor" text-anchor="middle" fill-opacity="0.8">trained on latents only;</text>
  <text x="355.0" y="228.0" font-size="10" fill="currentColor" text-anchor="middle" fill-opacity="0.8">no gradient reaches stage 1</text>
  <rect x="494.0" y="52.0" width="172.0" height="214.0" fill="none" fill-opacity="1.0" stroke="#1b1b1b" stroke-width="1.0" stroke-opacity="0.35" rx="6"/>
  <text x="580.0" y="72.0" font-size="11.5" fill="currentColor" text-anchor="middle" font-weight="600" fill-opacity="0.85">sampling</text>
  <text x="580.0" y="100.0" font-size="10.5" fill="currentColor" text-anchor="middle" fill-opacity="0.85">noise in latent space</text>
  <line x1="580.0" y1="108.0" x2="580.0" y2="126.0" stroke="currentColor" stroke-width="1.3" stroke-opacity="0.85"/>
  <polygon points="580.0,132.0 577.3,126.0 582.7,126.0" fill="currentColor" fill-opacity="0.85" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <text x="580.0" y="148.0" font-size="10.5" fill="currentColor" text-anchor="middle" fill-opacity="0.85">50 guided Euler steps</text>
  <text x="580.0" y="164.0" font-size="10.5" fill="currentColor" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" fill-opacity="0.7">= 100 DiT passes</text>
  <line x1="580.0" y1="172.0" x2="580.0" y2="190.0" stroke="currentColor" stroke-width="1.3" stroke-opacity="0.85"/>
  <polygon points="580.0,196.0 577.3,190.0 582.7,190.0" fill="currentColor" fill-opacity="0.85" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <text x="580.0" y="212.0" font-size="10.5" fill="currentColor" text-anchor="middle" fill-opacity="0.85">decoder, run once</text>
  <text x="580.0" y="236.0" font-size="10.5" fill="#440154" text-anchor="middle" fill-opacity="0.9">image out</text>
  <text x="350.0" y="294.0" font-size="11" fill="currentColor" text-anchor="middle" fill-opacity="0.75">4096 latent tokens against 262144 pixel-space tokens: a 64-fold reduction in sequence length,</text>
  <text x="350.0" y="310.0" font-size="11" fill="currentColor" text-anchor="middle" fill-opacity="0.75">and roughly four thousand fold in attention cost.</text>
</svg>
