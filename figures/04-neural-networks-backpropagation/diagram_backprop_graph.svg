<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320"
     role="img" aria-labelledby="bpFigTitle bpFigDesc" font-family="Source Serif 4, Georgia, serif">
  <title id="bpFigTitle">Computational graph of f = (x + y) z with forward values and gradients</title>
  <desc id="bpFigDesc">Inputs x = -2, y = 5 and z = -4 feed an addition producing q = 3 and a multiplication producing f = -12. Each edge carries its forward value and, beneath it, the derivative of f with respect to that edge: -4 on x, y and q, 3 on z, and 1 on f itself.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" opacity="0.55"/>
    </marker>
  </defs>
  <rect x="34" y="59" width="52" height="38" rx="6" fill="none" stroke="#3b528b" stroke-width="1.5"/>
  <text x="60.0" y="76.0" font-size="14" fill="#3b528b" text-anchor="middle" font-style="italic">x</text>
  <text x="60.0" y="92.0" font-size="12" fill="#1b1b1b" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace">−2</text>
  <rect x="34" y="153" width="52" height="38" rx="6" fill="none" stroke="#3b528b" stroke-width="1.5"/>
  <text x="60.0" y="170.0" font-size="14" fill="#3b528b" text-anchor="middle" font-style="italic">y</text>
  <text x="60.0" y="186.0" font-size="12" fill="#1b1b1b" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace">5</text>
  <rect x="34" y="243" width="52" height="38" rx="6" fill="none" stroke="#3b528b" stroke-width="1.5"/>
  <text x="60.0" y="260.0" font-size="14" fill="#3b528b" text-anchor="middle" font-style="italic">z</text>
  <text x="60.0" y="276.0" font-size="12" fill="#1b1b1b" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace">−4</text>
  <circle cx="232" cy="125" r="21" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.75"/>
  <text x="232.0" y="132.0" font-size="19" fill="#1b1b1b" text-anchor="middle">+</text>
  <circle cx="430" cy="196" r="21" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.75"/>
  <text x="430.0" y="203.0" font-size="19" fill="#1b1b1b" text-anchor="middle">×</text>
  <line x1="86.0" y1="78.0" x2="209.0" y2="116.0" stroke="currentColor" stroke-width="1.4" opacity="0.55" marker-end="url(#arrow)"/>
  <text x="129.1" y="77.3" font-size="13" fill="#1b1b1b" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace">−2</text>
  <text x="129.1" y="113.3" font-size="12.5" fill="#21918c" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace">−4</text>
  <line x1="86.0" y1="172.0" x2="209.0" y2="136.0" stroke="currentColor" stroke-width="1.4" opacity="0.55" marker-end="url(#arrow)"/>
  <text x="169.6" y="133.5" font-size="13" fill="#1b1b1b" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace">5</text>
  <text x="169.6" y="169.5" font-size="12.5" fill="#21918c" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace">−4</text>
  <line x1="253.0" y1="125.0" x2="407.0" y2="178.0" stroke="currentColor" stroke-width="1.4" opacity="0.55" marker-end="url(#arrow)"/>
  <text x="330.0" y="137.5" font-size="13" fill="#1b1b1b" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace">q = 3</text>
  <text x="330.0" y="173.5" font-size="12.5" fill="#21918c" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace">−4</text>
  <line x1="86.0" y1="262.0" x2="407.0" y2="214.0" stroke="currentColor" stroke-width="1.4" opacity="0.55" marker-end="url(#arrow)"/>
  <text x="285.0" y="218.2" font-size="13" fill="#1b1b1b" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace">−4</text>
  <text x="285.0" y="254.2" font-size="12.5" fill="#21918c" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace">3</text>
  <line x1="451.0" y1="196.0" x2="596.0" y2="196.0" stroke="currentColor" stroke-width="1.4" opacity="0.55" marker-end="url(#arrow)"/>
  <text x="523.5" y="182.0" font-size="13" fill="#1b1b1b" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace">f = −12</text>
  <text x="523.5" y="218.0" font-size="12.5" fill="#21918c" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace">1</text>
  <text x="660.0" y="201.0" font-size="16" fill="#440154" text-anchor="middle" font-style="italic">f</text>
  <text x="360.0" y="34.0" font-size="13" fill="#1b1b1b" text-anchor="middle">forward values</text>
  <text x="360.0" y="54.0" font-size="13" fill="#21918c" text-anchor="middle">gradients of f</text>
  <text x="360.0" y="300.0" font-size="12.5" fill="#21918c" text-anchor="middle" font-style="italic">backward pass runs right to left</text>
</svg>
