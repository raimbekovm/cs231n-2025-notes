<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330"
     role="img" aria-labelledby="pnetTitle pnetDesc" font-family="Source Serif 4, Georgia, serif">
  <title id="pnetTitle">The PointNet architecture</title>
  <desc id="pnetDesc">Four unordered points each pass through the same multilayer perceptron, an element-wise maximum reduces the resulting features to one global descriptor, and a final perceptron produces class scores.</desc>
