  <text x="566.0" y="167.0" font-size="11" fill="#440154" text-anchor="middle">class scores</text>
  <text x="646.0" y="116.0" font-size="11" fill="currentColor" text-anchor="start" fill-opacity="0.65">any order in,</text>
  <text x="646.0" y="134.0" font-size="11" fill="currentColor" text-anchor="start" fill-opacity="0.65">same answer out</text>
  <text x="380.0" y="308.0" font-size="11" fill="currentColor" text-anchor="middle" fill-opacity="0.62">the lift comes first: a maximum over raw coordinates returns only a bounding box</text>
