  <line x1="564.9" y1="300.0" x2="564.9" y2="305.0" stroke="currentColor" stroke-width="1.0" stroke-opacity="0.4"/>
  <text x="564.9" y="322.0" font-size="10" fill="currentColor" text-anchor="middle" fill-opacity="0.55">2020</text>
  <line x1="700.0" y1="300.0" x2="700.0" y2="305.0" stroke="currentColor" stroke-width="1.0" stroke-opacity="0.4"/>
  <text x="700.0" y="322.0" font-size="10" fill="currentColor" text-anchor="middle" fill-opacity="0.55">2025</text>
  <line x1="92.0" y1="300.0" x2="700.0" y2="300.0" stroke="currentColor" stroke-width="1.0" stroke-opacity="0.4"/>
  <text x="396.0" y="344.0" font-size="11" fill="currentColor" text-anchor="middle" fill-opacity="0.65">year of release</text>
  <text x="48.0" y="172.0" font-size="10" fill="currentColor" text-anchor="middle" fill-opacity="0.55">instances</text>
