  <text x="612.9" y="123.1" font-size="11" fill="#3b528b" text-anchor="middle" font-weight="600">Objaverse</text>
  <circle cx="646.0" cy="81.3" r="5.4" fill="#3b528b" fill-opacity="1.0" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <text x="630.0" y="103.3" font-size="11" fill="#3b528b" text-anchor="middle" font-weight="600">Objaverse-XL</text>
  <circle cx="112.0" cy="372.0" r="5.4" fill="#3b528b" fill-opacity="1.0" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <text x="124.0" y="376.0" font-size="11" fill="currentColor" text-anchor="start" fill-opacity="0.7">synthetic assets</text>
