  <text x="537.9" y="244.2" font-size="11" fill="#3b528b" text-anchor="middle" font-weight="600">PartNet</text>
  <circle cx="591.9" cy="230.7" r="5.4" fill="#21918c" fill-opacity="1.0" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
