  <polyline points="132.53,285.89 429.78,206.72 618.93,141.12 645.96,81.35" fill="none" stroke="#3b528b" stroke-width="2.0" stroke-opacity="0.55" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="132.5" cy="285.9" r="5.4" fill="#3b528b" fill-opacity="1.0" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
