<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400"
     role="img" aria-labelledby="dscaleTitle dscaleDesc" font-family="Source Serif 4, Georgia, serif">
  <title id="dscaleTitle">Sizes of 3D datasets by year against ImageNet</title>
  <desc id="dscaleDesc">A logarithmic scatter of 3D corpus sizes from 2004 to 2023, distinguishing synthetic asset collections from real scans, with ImageNet drawn as a horizontal reference line above all of them.</desc>
  <line x1="92.0" y1="300.0" x2="700.0" y2="300.0" stroke="currentColor" stroke-width="1.0" stroke-opacity="0.14"/>
  <text x="80.0" y="304.0" font-size="10" fill="currentColor" text-anchor="end" fill-opacity="0.55">1K</text>
  <line x1="92.0" y1="245.5" x2="700.0" y2="245.5" stroke="currentColor" stroke-width="1.0" stroke-opacity="0.14"/>
  <text x="80.0" y="249.5" font-size="10" fill="currentColor" text-anchor="end" fill-opacity="0.55">10K</text>
  <line x1="92.0" y1="190.9" x2="700.0" y2="190.9" stroke="currentColor" stroke-width="1.0" stroke-opacity="0.14"/>
  <text x="80.0" y="194.9" font-size="10" fill="currentColor" text-anchor="end" fill-opacity="0.55">100K</text>
  <line x1="92.0" y1="136.4" x2="700.0" y2="136.4" stroke="currentColor" stroke-width="1.0" stroke-opacity="0.14"/>
  <text x="80.0" y="140.4" font-size="10" fill="currentColor" text-anchor="end" fill-opacity="0.55">1M</text>
  <line x1="92.0" y1="81.8" x2="700.0" y2="81.8" stroke="currentColor" stroke-width="1.0" stroke-opacity="0.14"/>
  <text x="80.0" y="85.8" font-size="10" fill="currentColor" text-anchor="end" fill-opacity="0.55">10M</text>
  <line x1="159.6" y1="300.0" x2="159.6" y2="305.0" stroke="currentColor" stroke-width="1.0" stroke-opacity="0.4"/>
  <text x="159.6" y="322.0" font-size="10" fill="currentColor" text-anchor="middle" fill-opacity="0.55">2005</text>
  <line x1="294.7" y1="300.0" x2="294.7" y2="305.0" stroke="currentColor" stroke-width="1.0" stroke-opacity="0.4"/>
  <text x="294.7" y="322.0" font-size="10" fill="currentColor" text-anchor="middle" fill-opacity="0.55">2010</text>
  <line x1="429.8" y1="300.0" x2="429.8" y2="305.0" stroke="currentColor" stroke-width="1.0" stroke-opacity="0.4"/>
