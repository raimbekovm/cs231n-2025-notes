<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380"
     role="img" aria-labelledby="stradeTitle stradeDesc" font-family="Source Serif 4, Georgia, serif">
  <title id="stradeTitle">Rendering speed against quality for radiance-field methods</title>
  <desc id="stradeDesc">A scatter of five methods with rendering speed on a logarithmic axis and PSNR on a truncated linear axis, each labelled with its training time. An arrow marks the gap between the slowest and the fastest.</desc>
  <line x1="161.7" y1="282.0" x2="161.7" y2="287.0" stroke="currentColor" stroke-width="1.0" stroke-opacity="0.4"/>
  <text x="161.7" y="304.0" font-size="10" fill="currentColor" text-anchor="middle" fill-opacity="0.55">0.1</text>
  <line x1="309.4" y1="282.0" x2="309.4" y2="287.0" stroke="currentColor" stroke-width="1.0" stroke-opacity="0.4"/>
  <text x="309.4" y="304.0" font-size="10" fill="currentColor" text-anchor="middle" fill-opacity="0.55">1</text>
  <line x1="457.2" y1="282.0" x2="457.2" y2="287.0" stroke="currentColor" stroke-width="1.0" stroke-opacity="0.4"/>
  <text x="457.2" y="304.0" font-size="10" fill="currentColor" text-anchor="middle" fill-opacity="0.55">10</text>
  <line x1="604.9" y1="282.0" x2="604.9" y2="287.0" stroke="currentColor" stroke-width="1.0" stroke-opacity="0.4"/>
  <text x="604.9" y="304.0" font-size="10" fill="currentColor" text-anchor="middle" fill-opacity="0.55">100</text>
  <line x1="110.0" y1="282.0" x2="664.0" y2="282.0" stroke="currentColor" stroke-width="1.0" stroke-opacity="0.4"/>
  <line x1="110.0" y1="247.8" x2="664.0" y2="247.8" stroke="currentColor" stroke-width="1.0" stroke-opacity="0.14"/>
  <text x="98.0" y="251.8" font-size="10" fill="currentColor" text-anchor="end" fill-opacity="0.55">22</text>
  <line x1="110.0" y1="198.9" x2="664.0" y2="198.9" stroke="currentColor" stroke-width="1.0" stroke-opacity="0.14"/>
  <text x="98.0" y="202.9" font-size="10" fill="currentColor" text-anchor="end" fill-opacity="0.55">23</text>
  <line x1="110.0" y1="150.0" x2="664.0" y2="150.0" stroke="currentColor" stroke-width="1.0" stroke-opacity="0.14"/>
  <text x="98.0" y="154.0" font-size="10" fill="currentColor" text-anchor="end" fill-opacity="0.55">24</text>
  <line x1="110.0" y1="101.1" x2="664.0" y2="101.1" stroke="currentColor" stroke-width="1.0" stroke-opacity="0.14"/>
  <text x="98.0" y="105.1" font-size="10" fill="currentColor" text-anchor="end" fill-opacity="0.55">25</text>
  <text x="387.0" y="326.0" font-size="11" fill="currentColor" text-anchor="middle" fill-opacity="0.65">frames per second, logarithmic</text>
  <text x="58.0" y="172.0" font-size="10" fill="currentColor" text-anchor="middle" fill-opacity="0.55">PSNR</text>
  <text x="58.0" y="188.0" font-size="10" fill="currentColor" text-anchor="middle" fill-opacity="0.55">(dB)</text>
  <circle cx="139.7" cy="135.3" r="5.2" fill="#3b528b" fill-opacity="1.0" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <text x="139.7" y="115.3" font-size="11" fill="#3b528b" text-anchor="middle">Mip-NeRF360</text>
  <text x="139.7" y="100.3" font-size="10" fill="#3b528b" text-anchor="middle" fill-opacity="0.7">48 h</text>
  <circle cx="444.4" cy="252.7" r="5.2" fill="#3b528b" fill-opacity="1.0" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <text x="392.4" y="232.7" font-size="11" fill="#3b528b" text-anchor="middle">Plenoxels</text>
  <text x="392.4" y="217.7" font-size="10" fill="#3b528b" text-anchor="middle" fill-opacity="0.7">26 min</text>
  <circle cx="451.8" cy="242.9" r="5.2" fill="#3b528b" fill-opacity="1.0" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <text x="495.8" y="222.9" font-size="11" fill="#3b528b" text-anchor="middle">InstantNGP</text>
  <text x="495.8" y="207.9" font-size="10" fill="#3b528b" text-anchor="middle" fill-opacity="0.7">7 min</text>
