  <circle cx="600.3" cy="91.3" r="6.4" fill="#440154" fill-opacity="1.0" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <text x="600.3" y="71.3" font-size="11" fill="#440154" text-anchor="middle" font-weight="600">3DGS, 30K</text>
  <text x="600.3" y="56.3" font-size="10" fill="#440154" text-anchor="middle" fill-opacity="0.7">51 min</text>
  <line x1="153.7" y1="133.3" x2="577.3" y2="97.9" stroke="#21918c" stroke-width="1.5" stroke-opacity="0.8"/>
  <polygon points="584.3,97.3 577.5,101.1 577.0,94.8" fill="#21918c" fill-opacity="0.8" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <text x="400.0" y="99.3" font-size="12" fill="#21918c" text-anchor="middle" font-weight="600">×1,310 faster, +0.9 dB</text>
  <text x="387.0" y="356.0" font-size="11" fill="currentColor" text-anchor="middle" fill-opacity="0.62">the quality axis does not start at zero; the speed axis spans four decades</text>
</svg>
