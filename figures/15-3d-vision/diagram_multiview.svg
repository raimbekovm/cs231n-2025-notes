  <text x="716.0" y="166.0" font-size="13" fill="#21918c" text-anchor="end" font-weight="600">89.9%</text>
  <text x="624.0" y="182.0" font-size="10" fill="#21918c" text-anchor="start">MVCNN, 80 views</text>
  <text x="716.0" y="196.0" font-size="13" fill="#21918c" text-anchor="end" font-weight="600">90.1%</text>
  <text x="380.0" y="322.0" font-size="11" fill="currentColor" text-anchor="middle" fill-opacity="0.62">the maximum is what makes the descriptor order-independent</text>
