  <title id="mvcnnTitle">The multi-view CNN pipeline</title>
  <desc id="mvcnnDesc">Four rendered views each pass through the same convolutional network, an element-wise maximum pools them into one descriptor, and a second network classifies it. ModelNet40 accuracies are listed beside it.</desc>
