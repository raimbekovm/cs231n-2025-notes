  <text x="198.0" y="146.0" font-size="11.5" fill="currentColor" text-anchor="end">DQN, Atari</text>
  <text x="198.0" y="161.0" font-size="9.5" fill="currentColor" text-anchor="end" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" fill-opacity="0.6">10M frames at 60 Hz</text>
  <text x="323.5" y="151.0" font-size="10" fill="currentColor" text-anchor="start" font-style="italic" fill-opacity="0.7">simulator</text>
  <rect x="210.0" y="180.0" width="253.3" height="24.0" fill="#3b528b" fill-opacity="0.55" stroke="none" stroke-width="1.0" stroke-opacity="0"/>
  <text x="198.0" y="192.0" font-size="11.5" fill="currentColor" text-anchor="end">pi-zero</text>
  <text x="198.0" y="207.0" font-size="9.5" fill="currentColor" text-anchor="end" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" fill-opacity="0.6">10,000 h stated</text>
  <text x="471.3" y="197.0" font-size="10" fill="currentColor" text-anchor="start" font-style="italic" fill-opacity="0.7">real robots</text>
  <rect x="210.0" y="226.0" width="510.3" height="24.0" fill="#440154" fill-opacity="0.55" stroke="none" stroke-width="1.0" stroke-opacity="0"/>
  <text x="198.0" y="238.0" font-size="11.5" fill="currentColor" text-anchor="end">Rubik's cube</text>
  <text x="198.0" y="253.0" font-size="9.5" fill="currentColor" text-anchor="end" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" fill-opacity="0.6">~13,000 simulated years</text>
  <text x="728.3" y="243.0" font-size="10" fill="currentColor" text-anchor="start" font-style="italic" fill-opacity="0.7">simulator</text>
  <line x1="210.0" y1="286.0" x2="780.0" y2="286.0" stroke="currentColor" stroke-width="1.0" stroke-opacity="0.35"/>
  <line x1="210.0" y1="74.0" x2="210.0" y2="286.0" stroke="currentColor" stroke-width="1.0" stroke-opacity="0.35"/>
  <text x="420.0" y="352.0" font-size="11.5" fill="currentColor" text-anchor="middle" font-style="italic" fill-opacity="0.72">About 7 orders of magnitude, and the cheap end is the physical manipulation.</text>
</svg>
