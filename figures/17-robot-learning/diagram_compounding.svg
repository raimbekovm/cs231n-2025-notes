  <title id="compoundingTitle">Expected cost against horizon for behaviour cloning and DAgger</title>
  <desc id="compoundingDesc">A plot with horizon on the x axis and expected cost on the y axis. Behaviour cloning grows quadratically and then bends towards the total-failure ceiling; DAgger grows linearly and stays far below it; the quadratic expansion is drawn dashed and rises above the exact curve.</desc>
  <text x="420.0" y="26.0" font-size="14" fill="currentColor" text-anchor="middle" font-weight="600">Compounding error: why supervised learning on demonstrations is not supervised learning</text>
