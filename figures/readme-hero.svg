  <desc id="readmeHeroDesc">A banner showing the arc of the course as six motifs left to right: a grid of image pixels, two point clouds split by a linear boundary, a convolutional stack trading resolution for channels, a residual block with its shortcut, a causal attention matrix, and an image carrying object boxes and a segmentation mask.</desc>
