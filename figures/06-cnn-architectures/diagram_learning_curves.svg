  <title id="learnCurvesTitle">Four training-curve shapes and what each asks for</title>
  <desc id="learnCurvesDesc">Four small plots of training and validation accuracy against time. In the first both are still rising, calling for a longer run. In the second a wide and widening gap indicates overfitting. In the third the two curves coincide at a low value, indicating underfitting. In the fourth both plateau early, indicating a learning rate too large for the current stage.</desc>
