  <title id="normAxesTitle">Normalization layers differ only in which activations they average over</title>
  <desc id="normAxesDesc">Four copies of the same block of convolutional activations, with axes for batch, channel and spatial position. In each copy a different subset is shaded: batch normalization takes one channel across the whole batch, layer normalization takes one sample across all channels, instance normalization takes one channel of one sample, and group normalization takes a group of channels of one sample.</desc>
