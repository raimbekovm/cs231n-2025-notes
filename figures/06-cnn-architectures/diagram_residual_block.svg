  <line x1="160.0" y1="180.0" x2="160.0" y2="194.0" stroke="currentColor" stroke-width="1.2" stroke-opacity="0.55"/>
  <polygon points="160.0,200.0 157.3,194.0 162.7,194.0" fill="currentColor" fill-opacity="0.55" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <rect x="101.0" y="202.0" width="118.0" height="30.0" fill="#21918c" fill-opacity="0.22" stroke="#21918c" stroke-width="1.0" stroke-opacity="0.75" rx="4"/>
