  <title id="resBlockTitle">A plain block and a residual block</title>
  <desc id="resBlockDesc">Two vertical block diagrams. Both contain the same pair of three by three convolutions separated by a ReLU. In the residual block a second path carries the input around the convolutions and adds it back before the final activation, so the block computes F of x plus x rather than H of x.</desc>
