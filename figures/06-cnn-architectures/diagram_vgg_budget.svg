  <title id="vggBudgetTitle">Activation memory and parameter count per layer of VGG-16</title>
  <desc id="vggBudgetDesc">A diverging bar chart over the twenty-one layers of VGG-16. Bars above the axis are the number of activation values each layer produces for one 224 by 224 input; bars below are the number of learned parameters. Activations peak in the first two convolutional blocks and parameters peak in the first fully connected layer, which holds about three quarters of the network's weights.</desc>
