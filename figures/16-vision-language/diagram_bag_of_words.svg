<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 372" width="840" height="372"
     role="img" aria-labelledby="bowTitle bowDesc" font-family="Source Serif 4, Georgia, serif">
  <title id="bowTitle">Why in-batch negatives permit bag-of-words behaviour</title>
  <desc id="bowDesc">Two columns, each headed by the same correct caption. The left column lists three randomly drawn negative captions whose nouns are entirely disjoint from the positive, so matching nouns alone separates them. The right column lists three hard negatives built from the same words as the positive, differing only in relation, direction and word order, which noun matching cannot separate.</desc>
  <line x1="420.0" y1="44.0" x2="420.0" y2="300.0" stroke="currentColor" stroke-width="1.0" stroke-opacity="0.22" stroke-dasharray="4 4"/>
  <text x="20.0" y="28.0" font-size="13.5" fill="#1b1b1b" text-anchor="start">Negatives the batch actually supplies</text>
  <text x="444.0" y="28.0" font-size="13.5" fill="#1b1b1b" text-anchor="start">Negatives that would require more</text>
  <rect x="30.0" y="56.0" width="364.0" height="34.0" fill="#5ec962" fill-opacity="0.22" stroke="#1b1b1b" stroke-width="1.0" stroke-opacity="0.5" rx="3"/>
  <text x="44.0" y="78.0" font-size="12" fill="#1b1b1b" text-anchor="start" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace">the dog is left of the cat</text>
  <text x="380.0" y="78.0" font-size="13" fill="#1b1b1b" text-anchor="end">✓</text>
  <rect x="30.0" y="104.0" width="364.0" height="30.0" fill="#3b528b" fill-opacity="0.09" stroke="#1b1b1b" stroke-width="1.0" stroke-opacity="0.3" rx="3"/>
  <text x="44.0" y="124.0" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" fill-opacity="0.8">a plate of sushi on a table</text>
  <rect x="30.0" y="140.0" width="364.0" height="30.0" fill="#3b528b" fill-opacity="0.09" stroke="#1b1b1b" stroke-width="1.0" stroke-opacity="0.3" rx="3"/>
  <text x="44.0" y="160.0" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" fill-opacity="0.8">the golden gate bridge at dusk</text>
  <rect x="30.0" y="176.0" width="364.0" height="30.0" fill="#3b528b" fill-opacity="0.09" stroke="#1b1b1b" stroke-width="1.0" stroke-opacity="0.3" rx="3"/>
  <text x="44.0" y="196.0" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" fill-opacity="0.8">a child holding a red balloon</text>
  <text x="212.0" y="240.0" font-size="11.5" fill="#1b1b1b" text-anchor="middle" fill-opacity="0.72">Disjoint nouns. Detecting which objects are</text>
  <text x="212.0" y="258.0" font-size="11.5" fill="#1b1b1b" text-anchor="middle" fill-opacity="0.72">present is a complete solution, so that is all</text>
  <text x="212.0" y="276.0" font-size="11.5" fill="#1b1b1b" text-anchor="middle" fill-opacity="0.72">the gradient ever asks for.</text>
  <rect x="444.0" y="56.0" width="364.0" height="34.0" fill="#5ec962" fill-opacity="0.22" stroke="#1b1b1b" stroke-width="1.0" stroke-opacity="0.5" rx="3"/>
  <text x="458.0" y="78.0" font-size="12" fill="#1b1b1b" text-anchor="start" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace">the dog is left of the cat</text>
  <text x="794.0" y="78.0" font-size="13" fill="#1b1b1b" text-anchor="end">✓</text>
  <rect x="444.0" y="104.0" width="364.0" height="30.0" fill="#440154" fill-opacity="0.13" stroke="#1b1b1b" stroke-width="1.0" stroke-opacity="0.35" rx="3"/>
  <text x="458.0" y="124.0" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" fill-opacity="0.85">the cat is left of the dog</text>
  <rect x="444.0" y="140.0" width="364.0" height="30.0" fill="#440154" fill-opacity="0.13" stroke="#1b1b1b" stroke-width="1.0" stroke-opacity="0.35" rx="3"/>
  <text x="458.0" y="160.0" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" fill-opacity="0.85">the dog is right of the cat</text>
  <rect x="444.0" y="176.0" width="364.0" height="30.0" fill="#440154" fill-opacity="0.13" stroke="#1b1b1b" stroke-width="1.0" stroke-opacity="0.35" rx="3"/>
  <text x="458.0" y="196.0" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" fill-opacity="0.85">left the is dog of cat the</text>
  <text x="626.0" y="240.0" font-size="11.5" fill="#1b1b1b" text-anchor="middle" fill-opacity="0.72">Identical words, different structure. Nothing</text>
  <text x="626.0" y="258.0" font-size="11.5" fill="#1b1b1b" text-anchor="middle" fill-opacity="0.72">short of relation and order settles these, and</text>
  <text x="626.0" y="276.0" font-size="11.5" fill="#1b1b1b" text-anchor="middle" fill-opacity="0.72">a random draw never produces one.</text>
  <text x="420.0" y="356.0" font-size="11.5" fill="#1b1b1b" text-anchor="middle" fill-opacity="0.72">This is the gap ARO measures, and the reason its authors' fix is to mine such negatives deliberately.</text>
</svg>
