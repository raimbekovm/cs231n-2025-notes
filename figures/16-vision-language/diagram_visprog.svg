<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 430" width="840" height="430"
     role="img" aria-labelledby="visprogTitle visprogDesc" font-family="Source Serif 4, Georgia, serif">
  <title id="visprogTitle">VisProg's compile-and-execute loop</title>
  <desc id="visprogDesc">A natural-language instruction is passed to a language model that has been shown a few instruction-and-program pairs in context. It emits a short Python-like program whose four lines each invoke a frozen module — an object detector, an arithmetic selection, a face detector, and an image-processing blur. An interpreter runs the lines in order, threading each result into the next, and returns the final image.</desc>
  <rect x="24.0" y="44.0" width="190.0" height="52.0" fill="#5ec962" fill-opacity="0.2" stroke="#1b1b1b" stroke-width="1.0" stroke-opacity="0.55" rx="4"/>
  <text x="119.0" y="68.0" font-size="12" fill="#1b1b1b" text-anchor="middle">instruction</text>
  <text x="119.0" y="84.0" font-size="10.5" fill="#1b1b1b" text-anchor="middle" fill-opacity="0.7">natural language</text>
  <text x="119.0" y="116.0" font-size="11" fill="#1b1b1b" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" fill-opacity="0.85">“hide the face of the</text>
  <text x="119.0" y="132.0" font-size="11" fill="#1b1b1b" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" fill-opacity="0.85">person on the left”</text>
  <line x1="214.0" y1="70.0" x2="246.0" y2="70.0" stroke="currentColor" stroke-width="1.4" stroke-opacity="0.65"/>
  <polygon points="252.0,70.0 246.0,72.7 246.0,67.3" fill="currentColor" fill-opacity="0.65" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <rect x="252.0" y="44.0" width="128.0" height="52.0" fill="#440154" fill-opacity="0.16" stroke="#1b1b1b" stroke-width="1.0" stroke-opacity="0.55" rx="4"/>
  <text x="316.0" y="68.0" font-size="12" fill="#1b1b1b" text-anchor="middle">LLM</text>
  <text x="316.0" y="84.0" font-size="10.5" fill="#1b1b1b" text-anchor="middle" fill-opacity="0.7">in-context examples</text>
  <text x="316.0" y="116.0" font-size="11.5" fill="#1b1b1b" text-anchor="middle" fill-opacity="0.72">a few instruction–program</text>
  <text x="316.0" y="134.0" font-size="11.5" fill="#1b1b1b" text-anchor="middle" fill-opacity="0.62">pairs in the prompt; nothing trained</text>
