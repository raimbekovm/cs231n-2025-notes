<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 430" width="840" height="430"
     role="img" aria-labelledby="robustTitle robustDesc" font-family="Source Serif 4, Georgia, serif">
  <title id="robustTitle">CLIP under distribution shift</title>
  <desc id="robustDesc">A grouped bar chart of top-1 accuracy on ImageNet and six shifted evaluations, comparing a supervised ResNet-101 against zero-shot CLIP. The two are identical on ImageNet at 76.2 percent. On every shifted dataset the supervised model falls sharply while CLIP does not, with the largest gap on ImageNet-A, where the supervised model scores 2.7 percent against CLIP's 77.1.</desc>
  <text x="20.0" y="28.0" font-size="12.5" fill="#1b1b1b" text-anchor="start" fill-opacity="0.75">Top-1 accuracy (%)</text>
  <line x1="92.0" y1="322.0" x2="812.0" y2="322.0" stroke="currentColor" stroke-width="0.8" stroke-opacity="0.16"/>
  <text x="82.0" y="326.0" font-size="11" fill="#1b1b1b" text-anchor="end" fill-opacity="0.7">0</text>
  <line x1="92.0" y1="264.5" x2="812.0" y2="264.5" stroke="currentColor" stroke-width="0.8" stroke-opacity="0.16"/>
  <text x="82.0" y="268.5" font-size="11" fill="#1b1b1b" text-anchor="end" fill-opacity="0.7">25</text>
  <line x1="92.0" y1="207.0" x2="812.0" y2="207.0" stroke="currentColor" stroke-width="0.8" stroke-opacity="0.16"/>
  <text x="82.0" y="211.0" font-size="11" fill="#1b1b1b" text-anchor="end" fill-opacity="0.7">50</text>
  <line x1="92.0" y1="149.5" x2="812.0" y2="149.5" stroke="currentColor" stroke-width="0.8" stroke-opacity="0.16"/>
  <text x="82.0" y="153.5" font-size="11" fill="#1b1b1b" text-anchor="end" fill-opacity="0.7">75</text>
  <line x1="92.0" y1="92.0" x2="812.0" y2="92.0" stroke="currentColor" stroke-width="0.8" stroke-opacity="0.16"/>
  <text x="82.0" y="96.0" font-size="11" fill="#1b1b1b" text-anchor="end" fill-opacity="0.7">100</text>
  <line x1="92.0" y1="322.0" x2="812.0" y2="322.0" stroke="currentColor" stroke-width="1.1" stroke-opacity="0.5"/>
  <rect x="117.0" y="146.7" width="32.0" height="175.3" fill="#3b528b" fill-opacity="0.72" stroke="#1b1b1b" stroke-width="1.0" stroke-opacity="0.45"/>
  <text x="133.0" y="139.7" font-size="10" fill="#1b1b1b" text-anchor="middle" fill-opacity="0.85">76.2</text>
  <rect x="155.0" y="146.7" width="32.0" height="175.3" fill="#fde725" fill-opacity="0.72" stroke="#1b1b1b" stroke-width="1.0" stroke-opacity="0.45"/>
  <text x="171.0" y="139.7" font-size="10" fill="#1b1b1b" text-anchor="middle" fill-opacity="0.85">76.2</text>
  <text x="152.0" y="374.0" font-size="12" fill="#1b1b1b" text-anchor="middle" fill-opacity="0.45">—</text>
  <text x="152.0" y="342.0" font-size="11" fill="#1b1b1b" text-anchor="middle" fill-opacity="0.85">ImageNet</text>
  <rect x="237.0" y="174.1" width="32.0" height="147.9" fill="#3b528b" fill-opacity="0.72" stroke="#1b1b1b" stroke-width="1.0" stroke-opacity="0.45"/>
  <text x="253.0" y="167.1" font-size="10" fill="#1b1b1b" text-anchor="middle" fill-opacity="0.85">64.3</text>
