  <text x="512.0" y="374.0" font-size="12" fill="#440154" text-anchor="middle" font-weight="600">+39.7</text>
  <text x="512.0" y="342.0" font-size="11" fill="#1b1b1b" text-anchor="middle" fill-opacity="0.85">ObjectNet</text>
  <rect x="597.0" y="264.0" width="32.0" height="58.0" fill="#3b528b" fill-opacity="0.72" stroke="#1b1b1b" stroke-width="1.0" stroke-opacity="0.45"/>
  <text x="613.0" y="257.0" font-size="10" fill="#1b1b1b" text-anchor="middle" fill-opacity="0.85">25.2</text>
