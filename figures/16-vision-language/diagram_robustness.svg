  <rect x="477.0" y="247.0" width="32.0" height="75.0" fill="#3b528b" fill-opacity="0.72" stroke="#1b1b1b" stroke-width="1.0" stroke-opacity="0.45"/>
  <text x="493.0" y="240.0" font-size="10" fill="#1b1b1b" text-anchor="middle" fill-opacity="0.85">32.6</text>
