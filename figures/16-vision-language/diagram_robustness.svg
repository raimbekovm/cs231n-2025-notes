  <text x="272.0" y="374.0" font-size="12" fill="#440154" text-anchor="middle" font-weight="600">+5.8</text>
  <text x="272.0" y="342.0" font-size="11" fill="#1b1b1b" text-anchor="middle" fill-opacity="0.85">ImageNetV2</text>
  <rect x="357.0" y="235.3" width="32.0" height="86.7" fill="#3b528b" fill-opacity="0.72" stroke="#1b1b1b" stroke-width="1.0" stroke-opacity="0.45"/>
  <text x="373.0" y="228.3" font-size="10" fill="#1b1b1b" text-anchor="middle" fill-opacity="0.85">37.7</text>
