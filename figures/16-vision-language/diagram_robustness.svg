  <text x="733.0" y="308.8" font-size="10" fill="#1b1b1b" text-anchor="middle" fill-opacity="0.85">2.7</text>
  <rect x="755.0" y="144.7" width="32.0" height="177.3" fill="#fde725" fill-opacity="0.72" stroke="#1b1b1b" stroke-width="1.0" stroke-opacity="0.45"/>
  <text x="771.0" y="137.7" font-size="10" fill="#1b1b1b" text-anchor="middle" fill-opacity="0.85">77.1</text>
  <text x="752.0" y="374.0" font-size="12" fill="#440154" text-anchor="middle" font-weight="600">+74.4</text>
  <text x="752.0" y="342.0" font-size="11" fill="#1b1b1b" text-anchor="middle" fill-opacity="0.85">ImageNet-A</text>
  <text x="20.0" y="374.0" font-size="11.5" fill="#1b1b1b" text-anchor="start" fill-opacity="0.62">gap, in points</text>
  <rect x="452.0" y="44.0" width="13.0" height="13.0" fill="#3b528b" fill-opacity="0.72" stroke="#1b1b1b" stroke-width="1.0" stroke-opacity="0.45"/>
  <text x="472.0" y="55.0" font-size="11.5" fill="#1b1b1b" text-anchor="start">supervised ResNet-101</text>
  <rect x="646.0" y="44.0" width="13.0" height="13.0" fill="#fde725" fill-opacity="0.72" stroke="#1b1b1b" stroke-width="1.0" stroke-opacity="0.45"/>
  <text x="666.0" y="55.0" font-size="11.5" fill="#1b1b1b" text-anchor="start">zero-shot CLIP</text>
  <text x="420.0" y="414.0" font-size="11.5" fill="#1b1b1b" text-anchor="middle" fill-opacity="0.72">Matched on ImageNet by construction; the six evaluations to its right hold the categories fixed and move the pixels.</text>
</svg>
