<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" width="840" height="400"
     role="img" aria-labelledby="zshotTitle zshotDesc" font-family="Source Serif 4, Georgia, serif">
  <title id="zshotTitle">Constructing a zero-shot classifier</title>
  <desc id="zshotDesc">On the left, class names are inserted into a prompt template, passed through a frozen text encoder, and cached as one unit vector per class. On the right, a new image is encoded to a vector u, and the cached class vectors are stacked as the rows of a matrix W; the prediction is the argmax of the product W u, which is a linear classification head with no bias term.</desc>
  <line x1="438.0" y1="44.0" x2="438.0" y2="336.0" stroke="currentColor" stroke-width="1.0" stroke-opacity="0.22" stroke-dasharray="4 4"/>
  <text x="20.0" y="28.0" font-size="13.5" fill="#1b1b1b" text-anchor="start">Built once, from the label set</text>
  <text x="462.0" y="28.0" font-size="13.5" fill="#1b1b1b" text-anchor="start">…which is a linear head with no bias</text>
  <rect x="30.0" y="62.0" width="84.0" height="26.0" fill="#3b528b" fill-opacity="0.12" stroke="#1b1b1b" stroke-width="1.0" stroke-opacity="0.45" rx="3"/>
