<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 330" width="840" height="330"
     role="img" aria-labelledby="s2cTitle s2cDesc" font-family="Source Serif 4, Georgia, serif">
  <title id="s2cTitle">From SimCLR to CLIP</title>
  <desc id="s2cDesc">Two side-by-side diagrams. On the left, SimCLR passes two random augmentations of one photograph through the same image encoder and pulls the two embeddings together. On the right, CLIP replaces the second branch with a text encoder reading the image's published alt-text, so the positive pair comes from the web rather than from an augmentation pipeline.</desc>
  <text x="210.0" y="30.0" font-size="15" fill="#1b1b1b" text-anchor="middle" font-weight="600">SimCLR</text>
  <text x="630.0" y="30.0" font-size="15" fill="#1b1b1b" text-anchor="middle" font-weight="600">CLIP</text>
  <line x1="420.0" y1="46.0" x2="420.0" y2="300.0" stroke="currentColor" stroke-width="1.0" stroke-opacity="0.22" stroke-dasharray="4 4"/>
  <rect x="56.0" y="62.0" width="148.0" height="46.0" fill="#5ec962" fill-opacity="0.18" stroke="#1b1b1b" stroke-width="1.0" stroke-opacity="0.55" rx="4"/>
  <text x="130.0" y="83.0" font-size="13" fill="#1b1b1b" text-anchor="middle">augmentation 1</text>
  <text x="130.0" y="99.0" font-size="10.5" fill="#1b1b1b" text-anchor="middle" fill-opacity="0.7">random crop, jitter</text>
  <line x1="130.0" y1="108.0" x2="130.0" y2="134.0" stroke="currentColor" stroke-width="1.4" stroke-opacity="0.6"/>
  <polygon points="130.0,140.0 127.3,134.0 132.7,134.0" fill="currentColor" fill-opacity="0.6" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <rect x="56.0" y="140.0" width="148.0" height="40.0" fill="#21918c" fill-opacity="0.2" stroke="#1b1b1b" stroke-width="1.0" stroke-opacity="0.55" rx="4"/>
  <text x="130.0" y="164.5" font-size="13" fill="#1b1b1b" text-anchor="middle">image encoder</text>
  <line x1="130.0" y1="180.0" x2="130.0" y2="206.0" stroke="currentColor" stroke-width="1.4" stroke-opacity="0.6"/>
  <polygon points="130.0,212.0 127.3,206.0 132.7,206.0" fill="currentColor" fill-opacity="0.6" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <rect x="218.0" y="62.0" width="148.0" height="46.0" fill="#5ec962" fill-opacity="0.18" stroke="#1b1b1b" stroke-width="1.0" stroke-opacity="0.55" rx="4"/>
  <text x="292.0" y="83.0" font-size="13" fill="#1b1b1b" text-anchor="middle">augmentation 2</text>
  <text x="292.0" y="99.0" font-size="10.5" fill="#1b1b1b" text-anchor="middle" fill-opacity="0.7">random crop, jitter</text>
  <line x1="292.0" y1="108.0" x2="292.0" y2="134.0" stroke="currentColor" stroke-width="1.4" stroke-opacity="0.6"/>
  <polygon points="292.0,140.0 289.3,134.0 294.7,134.0" fill="currentColor" fill-opacity="0.6" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <rect x="218.0" y="140.0" width="148.0" height="40.0" fill="#21918c" fill-opacity="0.2" stroke="#1b1b1b" stroke-width="1.0" stroke-opacity="0.55" rx="4"/>
  <text x="292.0" y="164.5" font-size="13" fill="#1b1b1b" text-anchor="middle">image encoder</text>
  <line x1="292.0" y1="180.0" x2="292.0" y2="206.0" stroke="currentColor" stroke-width="1.4" stroke-opacity="0.6"/>
  <polygon points="292.0,212.0 289.3,206.0 294.7,206.0" fill="currentColor" fill-opacity="0.6" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <circle cx="130.0" cy="226.0" r="9.0" fill="#5ec962" fill-opacity="0.85" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <circle cx="292.0" cy="226.0" r="9.0" fill="#5ec962" fill-opacity="0.85" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <line x1="148.0" y1="226.0" x2="262.0" y2="226.0" stroke="#440154" stroke-width="1.6" stroke-opacity="0.8"/>
  <polygon points="268.0,226.0 262.0,228.7 262.0,223.3" fill="#440154" fill-opacity="0.8" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <line x1="274.0" y1="234.0" x2="160.0" y2="234.0" stroke="#440154" stroke-width="1.6" stroke-opacity="0.8"/>
  <polygon points="154.0,234.0 160.0,231.3 160.0,236.7" fill="#440154" fill-opacity="0.8" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <text x="211.0" y="268.0" font-size="11.5" fill="#1b1b1b" text-anchor="middle" fill-opacity="0.72">pull together</text>
  <text x="211.0" y="292.0" font-size="11.5" fill="#1b1b1b" text-anchor="middle" fill-opacity="0.6">the positive pair was manufactured</text>
  <rect x="476.0" y="62.0" width="148.0" height="46.0" fill="#5ec962" fill-opacity="0.18" stroke="#1b1b1b" stroke-width="1.0" stroke-opacity="0.55" rx="4"/>
  <text x="550.0" y="83.0" font-size="13" fill="#1b1b1b" text-anchor="middle">photograph</text>
  <text x="550.0" y="99.0" font-size="10.5" fill="#1b1b1b" text-anchor="middle" fill-opacity="0.7">as published</text>
  <line x1="550.0" y1="108.0" x2="550.0" y2="134.0" stroke="currentColor" stroke-width="1.4" stroke-opacity="0.6"/>
  <polygon points="550.0,140.0 547.3,134.0 552.7,134.0" fill="currentColor" fill-opacity="0.6" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <rect x="476.0" y="140.0" width="148.0" height="40.0" fill="#21918c" fill-opacity="0.2" stroke="#1b1b1b" stroke-width="1.0" stroke-opacity="0.55" rx="4"/>
  <text x="550.0" y="164.5" font-size="13" fill="#1b1b1b" text-anchor="middle">image encoder</text>
  <line x1="550.0" y1="180.0" x2="550.0" y2="206.0" stroke="currentColor" stroke-width="1.4" stroke-opacity="0.6"/>
  <polygon points="550.0,212.0 547.3,206.0 552.7,206.0" fill="currentColor" fill-opacity="0.6" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <rect x="638.0" y="62.0" width="148.0" height="46.0" fill="#fde725" fill-opacity="0.18" stroke="#1b1b1b" stroke-width="1.0" stroke-opacity="0.55" rx="4"/>
  <text x="712.0" y="83.0" font-size="13" fill="#1b1b1b" text-anchor="middle">its alt-text</text>
  <text x="712.0" y="99.0" font-size="10.5" fill="#1b1b1b" text-anchor="middle" fill-opacity="0.7">“a golden retriever”</text>
  <line x1="712.0" y1="108.0" x2="712.0" y2="134.0" stroke="currentColor" stroke-width="1.4" stroke-opacity="0.6"/>
  <polygon points="712.0,140.0 709.3,134.0 714.7,134.0" fill="currentColor" fill-opacity="0.6" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <rect x="638.0" y="140.0" width="148.0" height="40.0" fill="#3b528b" fill-opacity="0.2" stroke="#1b1b1b" stroke-width="1.0" stroke-opacity="0.55" rx="4"/>
  <text x="712.0" y="164.5" font-size="13" fill="#1b1b1b" text-anchor="middle">text encoder</text>
  <line x1="712.0" y1="180.0" x2="712.0" y2="206.0" stroke="currentColor" stroke-width="1.4" stroke-opacity="0.6"/>
  <polygon points="712.0,212.0 709.3,206.0 714.7,206.0" fill="currentColor" fill-opacity="0.6" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <circle cx="550.0" cy="226.0" r="9.0" fill="#5ec962" fill-opacity="0.85" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <circle cx="712.0" cy="226.0" r="9.0" fill="#3b528b" fill-opacity="0.85" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <line x1="568.0" y1="226.0" x2="682.0" y2="226.0" stroke="#440154" stroke-width="1.6" stroke-opacity="0.8"/>
  <polygon points="688.0,226.0 682.0,228.7 682.0,223.3" fill="#440154" fill-opacity="0.8" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <line x1="694.0" y1="234.0" x2="580.0" y2="234.0" stroke="#440154" stroke-width="1.6" stroke-opacity="0.8"/>
  <polygon points="574.0,234.0 580.0,231.3 580.0,236.7" fill="#440154" fill-opacity="0.8" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <text x="631.0" y="268.0" font-size="11.5" fill="#1b1b1b" text-anchor="middle" fill-opacity="0.72">pull together</text>
  <text x="631.0" y="292.0" font-size="11.5" fill="#1b1b1b" text-anchor="middle" fill-opacity="0.6">the positive pair was already on the web</text>
</svg>
