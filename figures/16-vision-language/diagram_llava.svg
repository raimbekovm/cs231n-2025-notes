  <line x1="724.0" y1="122.0" x2="746.0" y2="122.0" stroke="currentColor" stroke-width="1.4" stroke-opacity="0.6"/>
  <polygon points="752.0,122.0 746.0,124.7 746.0,119.3" fill="currentColor" fill-opacity="0.6" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <rect x="752.0" y="92.0" width="68.0" height="60.0" fill="#440154" fill-opacity="0.16" stroke="#1b1b1b" stroke-width="1.0" stroke-opacity="0.55" rx="4"/>
  <text x="786.0" y="120.0" font-size="12" fill="#1b1b1b" text-anchor="middle">LLM</text>
  <text x="786.0" y="136.0" font-size="10.5" fill="#1b1b1b" text-anchor="middle" fill-opacity="0.7">Vicuna</text>
  <line x1="786.0" y1="152.0" x2="786.0" y2="176.0" stroke="currentColor" stroke-width="1.4" stroke-opacity="0.6"/>
  <polygon points="786.0,182.0 783.3,176.0 788.7,176.0" fill="currentColor" fill-opacity="0.6" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <text x="786.0" y="200.0" font-size="11.5" fill="#1b1b1b" text-anchor="middle" fill-opacity="0.72">free-form</text>
  <text x="786.0" y="218.0" font-size="11.5" fill="#1b1b1b" text-anchor="middle" fill-opacity="0.72">text answer</text>
  <text x="420.0" y="310.0" font-size="11.5" fill="#1b1b1b" text-anchor="middle" fill-opacity="0.72">Stage 1 trains W alone; stage 2 trains W and the language model on GPT-4-written instruction data.</text>
</svg>
