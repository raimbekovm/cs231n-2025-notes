  <rect x="564.0" y="100.0" width="26.0" height="44.0" fill="#fde725" fill-opacity="0.5" stroke="#1b1b1b" stroke-width="1.0" stroke-opacity="0.4" rx="3"/>
  <rect x="598.0" y="100.0" width="26.0" height="44.0" fill="#3b528b" fill-opacity="0.22" stroke="#1b1b1b" stroke-width="1.0" stroke-opacity="0.4" rx="3"/>
  <rect x="628.0" y="100.0" width="26.0" height="44.0" fill="#3b528b" fill-opacity="0.22" stroke="#1b1b1b" stroke-width="1.0" stroke-opacity="0.4" rx="3"/>
  <rect x="658.0" y="100.0" width="26.0" height="44.0" fill="#3b528b" fill-opacity="0.22" stroke="#1b1b1b" stroke-width="1.0" stroke-opacity="0.4" rx="3"/>
  <rect x="688.0" y="100.0" width="26.0" height="44.0" fill="#3b528b" fill-opacity="0.22" stroke="#1b1b1b" stroke-width="1.0" stroke-opacity="0.4" rx="3"/>
  <text x="534.0" y="164.0" font-size="11.5" fill="#1b1b1b" text-anchor="middle" fill-opacity="0.72">visual tokens</text>
  <text x="658.0" y="164.0" font-size="11.5" fill="#1b1b1b" text-anchor="middle" fill-opacity="0.72">text tokens</text>
