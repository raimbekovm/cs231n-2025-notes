  <text x="596.0" y="62.0" font-size="11.5" fill="#1b1b1b" text-anchor="middle" fill-opacity="0.72">one sequence, and self-attention cannot tell them apart</text>
  <rect x="474.0" y="100.0" width="26.0" height="44.0" fill="#fde725" fill-opacity="0.5" stroke="#1b1b1b" stroke-width="1.0" stroke-opacity="0.4" rx="3"/>
