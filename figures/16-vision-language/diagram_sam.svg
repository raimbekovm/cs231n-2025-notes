  <text x="329.0" y="283.0" font-size="10.5" fill="#1b1b1b" text-anchor="middle">prompt</text>
  <text x="329.0" y="299.0" font-size="10.5" fill="#1b1b1b" text-anchor="middle" fill-opacity="0.7">encoder</text>
  <line x1="366.0" y1="130.0" x2="419.7" y2="181.8" stroke="currentColor" stroke-width="1.4" stroke-opacity="0.6"/>
  <polygon points="424.0,186.0 417.8,183.8 421.6,179.9" fill="currentColor" fill-opacity="0.6" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <line x1="366.0" y1="285.0" x2="419.8" y2="230.3" stroke="currentColor" stroke-width="1.4" stroke-opacity="0.6"/>
  <polygon points="424.0,226.0 421.7,232.2 417.9,228.4" fill="currentColor" fill-opacity="0.6" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <rect x="428.0" y="182.0" width="112.0" height="50.0" fill="#440154" fill-opacity="0.18" stroke="#1b1b1b" stroke-width="1.0" stroke-opacity="0.55" rx="4"/>
  <text x="484.0" y="211.5" font-size="11" fill="#1b1b1b" text-anchor="middle">mask decoder</text>
  <text x="484.0" y="252.0" font-size="11.5" fill="#1b1b1b" text-anchor="middle" fill-opacity="0.72">~50 ms</text>
  <text x="484.0" y="270.0" font-size="11.5" fill="#1b1b1b" text-anchor="middle" fill-opacity="0.62">per prompt</text>
  <line x1="540.0" y1="207.0" x2="592.4" y2="136.8" stroke="currentColor" stroke-width="1.4" stroke-opacity="0.6"/>
  <polygon points="596.0,132.0 594.6,138.4 590.2,135.2" fill="currentColor" fill-opacity="0.6" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <rect x="600.0" y="110.0" width="208.0" height="48.0" fill="#3b528b" fill-opacity="0.14" stroke="#1b1b1b" stroke-width="1.0" stroke-opacity="0.4" rx="4"/>
  <text x="620.0" y="132.0" font-size="12" fill="#1b1b1b" text-anchor="start">the shirt</text>
  <text x="620.0" y="148.0" font-size="10" fill="#1b1b1b" text-anchor="start" fill-opacity="0.65">part</text>
  <text x="792.0" y="140.0" font-size="9.5" fill="#1b1b1b" text-anchor="end" fill-opacity="0.55">score</text>
  <line x1="540.0" y1="207.0" x2="590.0" y2="204.3" stroke="currentColor" stroke-width="1.4" stroke-opacity="0.6"/>
  <polygon points="596.0,204.0 590.2,207.0 589.9,201.6" fill="currentColor" fill-opacity="0.6" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <rect x="600.0" y="182.0" width="208.0" height="48.0" fill="#3b528b" fill-opacity="0.14" stroke="#1b1b1b" stroke-width="1.0" stroke-opacity="0.4" rx="4"/>
  <text x="620.0" y="204.0" font-size="12" fill="#1b1b1b" text-anchor="start">the person</text>
  <text x="620.0" y="220.0" font-size="10" fill="#1b1b1b" text-anchor="start" fill-opacity="0.65">whole</text>
  <text x="792.0" y="212.0" font-size="9.5" fill="#1b1b1b" text-anchor="end" fill-opacity="0.55">score</text>
  <line x1="540.0" y1="207.0" x2="592.2" y2="271.3" stroke="currentColor" stroke-width="1.4" stroke-opacity="0.6"/>
  <polygon points="596.0,276.0 590.1,273.0 594.3,269.6" fill="currentColor" fill-opacity="0.6" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <rect x="600.0" y="254.0" width="208.0" height="48.0" fill="#3b528b" fill-opacity="0.14" stroke="#1b1b1b" stroke-width="1.0" stroke-opacity="0.4" rx="4"/>
  <text x="620.0" y="276.0" font-size="12" fill="#1b1b1b" text-anchor="start">the group</text>
  <text x="620.0" y="292.0" font-size="10" fill="#1b1b1b" text-anchor="start" fill-opacity="0.65">containing set</text>
  <text x="792.0" y="284.0" font-size="9.5" fill="#1b1b1b" text-anchor="end" fill-opacity="0.55">score</text>
  <text x="704.0" y="84.0" font-size="11.5" fill="#1b1b1b" text-anchor="middle" fill-opacity="0.72">three masks, not an average of three</text>
  <text x="704.0" y="320.0" font-size="11.5" fill="#1b1b1b" text-anchor="middle" fill-opacity="0.62">one point on a shirt has three correct answers</text>
  <text x="420.0" y="382.0" font-size="11.5" fill="#1b1b1b" text-anchor="middle" fill-opacity="0.72">Re-encoding per prompt would cost 6.4x more over 16 prompts on one image; the split is what makes interaction affordable.</text>
</svg>
