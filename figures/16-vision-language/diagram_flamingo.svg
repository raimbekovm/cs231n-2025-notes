  <text x="76.0" y="178.5" font-size="10.5" fill="#1b1b1b" text-anchor="middle">vision encoder</text>
  <line x1="70.0" y1="210.0" x2="82.0" y2="210.0" stroke="#3b528b" stroke-width="1.3" stroke-opacity="0.75"/>
  <line x1="73.0" y1="204.8" x2="79.0" y2="215.2" stroke="#3b528b" stroke-width="1.3" stroke-opacity="0.75"/>
