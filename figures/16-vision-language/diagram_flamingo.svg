  <text x="240.0" y="348.0" font-size="11.5" fill="#1b1b1b" text-anchor="middle" fill-opacity="0.72">learned latent queries</text>
  <text x="240.0" y="366.0" font-size="11.5" fill="#1b1b1b" text-anchor="middle" fill-opacity="0.6">cross-attend to the features</text>
