  <text x="76.0" y="336.0" font-size="11.5" fill="#1b1b1b" text-anchor="middle" fill-opacity="0.72">features: size varies with</text>
  <text x="76.0" y="354.0" font-size="11.5" fill="#1b1b1b" text-anchor="middle" fill-opacity="0.6">resolution and duration</text>
  <line x1="150.0" y1="286.0" x2="180.0" y2="286.0" stroke="currentColor" stroke-width="1.4" stroke-opacity="0.65"/>
