  <line x1="433.0" y1="344.8" x2="439.0" y2="355.2" stroke="#3b528b" stroke-width="1.3" stroke-opacity="0.75"/>
  <line x1="439.0" y1="344.8" x2="433.0" y2="355.2" stroke="#3b528b" stroke-width="1.3" stroke-opacity="0.75"/>
