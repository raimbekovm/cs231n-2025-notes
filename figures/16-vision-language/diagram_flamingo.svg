  <text x="724.0" y="288.0" font-size="13" fill="#1b1b1b" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace">× tanh(α)</text>
  <text x="724.0" y="306.0" font-size="10.5" fill="#1b1b1b" text-anchor="middle" fill-opacity="0.72">α initialised to 0</text>
  <rect x="648.0" y="326.0" width="152.0" height="72.0" fill="#3b528b" fill-opacity="0.1" stroke="#1b1b1b" stroke-width="1.0" stroke-opacity="0.35" rx="4"/>
  <text x="724.0" y="348.0" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="600">at step zero</text>
  <text x="724.0" y="368.0" font-size="11" fill="#1b1b1b" text-anchor="middle" fill-opacity="0.78">tanh(0) = 0, so the block</text>
  <text x="724.0" y="384.0" font-size="11" fill="#1b1b1b" text-anchor="middle" fill-opacity="0.78">contributes exactly nothing</text>
  <text x="530.0" y="414.0" font-size="11.5" fill="#1b1b1b" text-anchor="middle" fill-opacity="0.72">every gated block cross-attends to the 64 tokens from the left</text>
  <text x="420.0" y="434.0" font-size="11.5" fill="#1b1b1b" text-anchor="middle" fill-opacity="0.72">Removing the zero-initialised gate costs 4.2 points on Flamingo's aggregate score and destabilises training.</text>
