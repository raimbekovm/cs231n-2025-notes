<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 452" width="840" height="452"
     role="img" aria-labelledby="flamTitle flamDesc" font-family="Source Serif 4, Georgia, serif">
  <title id="flamTitle">Flamingo's architecture</title>
  <desc id="flamDesc">On the left, a frozen vision encoder produces a feature grid whose size varies with resolution and duration; a Perceiver Resampler with learned latent queries compresses it to exactly 64 visual tokens. On the right, gated cross-attention blocks are interleaved between the layers of a frozen language model, each scaling its output by the hyperbolic tangent of a learnable scalar initialised to zero, so that at initialisation the composite model reproduces the frozen model exactly.</desc>
  <line x1="392.0" y1="52.0" x2="392.0" y2="396.0" stroke="currentColor" stroke-width="1.0" stroke-opacity="0.22" stroke-dasharray="4 4"/>
  <text x="20.0" y="30.0" font-size="13.5" fill="#1b1b1b" text-anchor="start">Variable input, fixed output</text>
  <text x="416.0" y="30.0" font-size="13.5" fill="#1b1b1b" text-anchor="start">Inserted without disturbing the frozen model</text>
  <rect x="28.0" y="74.0" width="96.0" height="48.0" fill="#5ec962" fill-opacity="0.2" stroke="#1b1b1b" stroke-width="1.0" stroke-opacity="0.55" rx="4"/>
  <text x="76.0" y="96.0" font-size="12" fill="#1b1b1b" text-anchor="middle">image</text>
  <text x="76.0" y="112.0" font-size="10.5" fill="#1b1b1b" text-anchor="middle" fill-opacity="0.7">or video</text>
  <line x1="76.0" y1="122.0" x2="76.0" y2="146.0" stroke="currentColor" stroke-width="1.4" stroke-opacity="0.6"/>
  <polygon points="76.0,152.0 73.3,146.0 78.7,146.0" fill="currentColor" fill-opacity="0.6" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
