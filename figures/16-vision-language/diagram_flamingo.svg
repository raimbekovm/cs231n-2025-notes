  <rect x="332.0" y="290.0" width="46.0" height="12.0" fill="#fde725" fill-opacity="0.6" stroke="#1b1b1b" stroke-width="1.0" stroke-opacity="0.35" rx="2"/>
  <rect x="332.0" y="306.0" width="46.0" height="12.0" fill="#fde725" fill-opacity="0.6" stroke="#1b1b1b" stroke-width="1.0" stroke-opacity="0.35" rx="2"/>
  <text x="355.0" y="240.0" font-size="11.5" fill="#1b1b1b" text-anchor="middle" fill-opacity="0.72">exactly 64</text>
  <text x="355.0" y="340.0" font-size="11.5" fill="#1b1b1b" text-anchor="middle" fill-opacity="0.6">however much</text>
  <text x="355.0" y="358.0" font-size="11.5" fill="#1b1b1b" text-anchor="middle" fill-opacity="0.6">came in</text>
  <text x="530.0" y="58.0" font-size="11.5" fill="#1b1b1b" text-anchor="middle" fill-opacity="0.72">residual stream, bottom to top</text>
  <rect x="452.0" y="330.0" width="156.0" height="40.0" fill="#3b528b" fill-opacity="0.2" stroke="#1b1b1b" stroke-width="1.0" stroke-opacity="0.55" rx="4"/>
  <text x="530.0" y="354.5" font-size="11" fill="#1b1b1b" text-anchor="middle">frozen LM layer</text>
