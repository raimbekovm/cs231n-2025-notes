<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" width="700" height="330"
     role="img" aria-labelledby="ilsvrcTitle ilsvrcDesc" font-family="Source Serif 4, Georgia, serif">
  <title id="ilsvrcTitle">Winning top-5 error on the ImageNet challenge, 2010–2015</title>
  <desc id="ilsvrcDesc">Error falls slowly from 28.2 per cent in 2010 to 25.8 in 2011, then drops
  to 15.3 in 2012 when a convolutional network wins, and continues down to 3.6 per cent by 2015.
  The best non-convolutional entry of 2012 scored 26.2 per cent, close to the previous year.</desc>

  <!-- grid -->
  <g stroke="currentColor" opacity="0.18" stroke-width="1">
    <line x1="90" y1="40"  x2="640" y2="40"/>
    <line x1="90" y1="117" x2="640" y2="117"/>
    <line x1="90" y1="193" x2="640" y2="193"/>
    <line x1="90" y1="270" x2="640" y2="270"/>
  </g>
  <g fill="currentColor" font-size="12" text-anchor="end" opacity="0.75">
    <text x="80" y="44">30%</text>
    <text x="80" y="121">20%</text>
    <text x="80" y="197">10%</text>
    <text x="80" y="274">0%</text>
  </g>

  <!-- the pre-2012 era: shallow pipelines -->
  <path d="M 90 54 L 200 72" fill="none" stroke="#868f99" stroke-width="2.6"/>
  <!-- 2011 to the best non-CNN entry of 2012: essentially flat -->
  <path d="M 200 72 L 310 69" fill="none" stroke="#868f99" stroke-width="2.2" stroke-dasharray="5 4"/>
  <!-- the convolutional era -->
  <path d="M 200 72 L 310 153 L 420 184 L 530 219 L 640 243"
        fill="none" stroke="#2a788e" stroke-width="3"/>

  <!-- human reference -->
  <line x1="90" y1="231" x2="640" y2="231" stroke="#440154" stroke-width="1.6" stroke-dasharray="6 5" opacity="0.85"/>
  <text x="98" y="225" fill="#440154" font-size="11.5">human annotator, 5.1%</text>

  <!-- points -->
  <g>
    <circle cx="90"  cy="54"  r="5" fill="#868f99"/>
    <circle cx="200" cy="72"  r="5" fill="#868f99"/>
    <circle cx="310" cy="69"  r="5" fill="none" stroke="#868f99" stroke-width="2.4"/>
    <circle cx="310" cy="153" r="6.5" fill="#2a788e"/>
    <circle cx="420" cy="184" r="5" fill="#2a788e"/>
    <circle cx="530" cy="219" r="5" fill="#2a788e"/>
    <circle cx="640" cy="243" r="5" fill="#2a788e"/>
  </g>

  <!-- value labels -->
  <g fill="currentColor" font-size="12" text-anchor="middle">
    <text x="112" y="50" text-anchor="start">28.2</text>
    <text x="196" y="60">25.8</text>
    <text x="345" y="63">26.2 · best entry without a neural network</text>
    <text x="322" y="146" font-weight="600" fill="#2a788e">15.3</text>
    <text x="428" y="176">11.2</text>
    <text x="538" y="211">6.7</text>
    <text x="632" y="257">3.6</text>
  </g>

  <!-- x axis -->
  <line x1="90" y1="270" x2="640" y2="270" stroke="currentColor" stroke-width="1.2" opacity="0.5"/>
  <g fill="currentColor" font-size="12.5" text-anchor="middle">
    <text x="90"  y="290">2010</text>
    <text x="200" y="290">2011</text>
    <text x="310" y="290">2012</text>
    <text x="420" y="290">2013</text>
    <text x="530" y="290">2014</text>
    <text x="640" y="290">2015</text>
  </g>

  <!-- the break -->
  <line x1="255" y1="40" x2="255" y2="270" stroke="#2a788e" stroke-width="1" stroke-dasharray="3 4" opacity="0.5"/>

  <g fill="currentColor" font-size="12.5" opacity="0.78">
    <text x="96" y="314">hand-designed features</text>
    <text x="264" y="314">every winner from 2012 onward is a convolutional network</text>
  </g>
</svg>
