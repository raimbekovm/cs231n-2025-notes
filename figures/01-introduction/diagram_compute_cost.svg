<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" width="700" height="330"
     role="img" aria-labelledby="computeTitle computeDesc" font-family="Source Serif 4, Georgia, serif">
  <title id="computeTitle">Single-precision throughput per dollar of consumer NVIDIA GPUs, 2006–2020</title>
  <desc id="computeDesc">Arithmetic per dollar rises slowly from under one GFLOP per dollar in 2006
  to about three in 2010, then climbs steeply after deep learning becomes the workload these
  cards are bought for, reaching roughly twenty-four GFLOP per dollar by 2020. The 2018 point
  falls below the 2017 one, so the trend is not monotonic.</desc>

  <!-- grid -->
  <g stroke="currentColor" opacity="0.18" stroke-width="1">
    <line x1="90" y1="40"  x2="640" y2="40"/>
    <line x1="90" y1="86"  x2="640" y2="86"/>
    <line x1="90" y1="132" x2="640" y2="132"/>
    <line x1="90" y1="178" x2="640" y2="178"/>
    <line x1="90" y1="224" x2="640" y2="224"/>
    <line x1="90" y1="270" x2="640" y2="270"/>
  </g>
  <g fill="currentColor" font-size="12" text-anchor="end" opacity="0.75">
    <text x="80" y="44">25</text>
    <text x="80" y="90">20</text>
    <text x="80" y="136">15</text>
    <text x="80" y="182">10</text>
    <text x="80" y="228">5</text>
    <text x="80" y="274">0</text>
  </g>
  <text x="26" y="160" fill="currentColor" font-size="12.5" opacity="0.8"
        transform="rotate(-90 26 160)" text-anchor="middle">GFLOP per dollar</text>

  <!-- pre-deep-learning slope -->
  <path d="M 90 262 L 247 241" fill="none" stroke="#868f99" stroke-width="2.6"/>
  <!-- after deep learning becomes the workload -->
  <path d="M 247 241 L 365 204 L 522 121 L 561 146 L 640 52"
        fill="none" stroke="#2a788e" stroke-width="3"/>

  <!-- points -->
  <g>
    <circle cx="90"  cy="262" r="5" fill="#868f99"/>
    <circle cx="247" cy="241" r="6.5" fill="#440154"/>
    <circle cx="365" cy="204" r="5" fill="#2a788e"/>
    <circle cx="522" cy="121" r="5" fill="#2a788e"/>
    <circle cx="561" cy="146" r="5" fill="#2a788e"/>
    <circle cx="640" cy="52"  r="5" fill="#2a788e"/>
  </g>

  <!-- card labels -->
  <g fill="currentColor" font-size="11.5">
    <text x="96"  y="255">8800 GTX</text>
    <text x="238" y="235" fill="#440154" font-weight="600" text-anchor="end">GTX 580</text>
    <text x="316" y="196">780 Ti</text>
    <text x="470" y="114">1080 Ti</text>
    <text x="566" y="164">2080 Ti</text>
    <text x="600" y="45">RTX 3090</text>
  </g>

  <!-- the AlexNet tie-in -->
  <path d="M 247 249 L 247 288" stroke="#440154" stroke-width="1" opacity="0.55"/>
  <text x="252" y="300" fill="#440154" font-size="11.5">AlexNet was trained on two of these</text>

  <!-- x axis -->
  <line x1="90" y1="270" x2="640" y2="270" stroke="currentColor" stroke-width="1.2" opacity="0.5"/>
  <g fill="currentColor" font-size="12.5" text-anchor="middle">
    <text x="90"  y="287">2006</text>
    <text x="247" y="287">2010</text>
    <text x="404" y="287">2014</text>
    <text x="640" y="287">2020</text>
  </g>

  <text x="640" y="320" fill="currentColor" font-size="12" text-anchor="end" opacity="0.7">
    vendor FP32 figures ÷ launch price, nominal dollars
  </text>
</svg>
