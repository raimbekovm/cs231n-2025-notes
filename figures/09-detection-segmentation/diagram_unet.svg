  <title id="unetTitle">The U-Net architecture</title>
  <desc id="unetDesc">Feature maps descend to the left, shrinking in height and growing in width, reach a narrow bottleneck at the bottom, then ascend to the right in mirror image. At each of the three levels a dashed arrow runs horizontally from the left map to its counterpart on the right, labelled copy and concatenate.</desc>
