  <text x="40.0" y="370.0" font-size="14" fill="currentColor" text-anchor="start" font-weight="600">Faster R-CNN</text>
  <text x="40.0" y="387.0" font-size="11.5" fill="currentColor" text-anchor="start" fill-opacity="0.7">proposals come from the same features</text>
