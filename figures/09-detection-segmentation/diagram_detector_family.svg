  <text x="593.0" y="132.0" font-size="10.5" fill="currentColor" text-anchor="middle" fill-opacity="0.7">per region</text>
  <rect x="668.0" y="96.0" width="150.0" height="46.0" fill="#5ec962" fill-opacity="0.16" stroke="#5ec962" stroke-width="1.3" stroke-opacity="0.85" rx="6"/>
  <text x="743.0" y="123.5" font-size="12.5" fill="currentColor" text-anchor="middle">class + box</text>
