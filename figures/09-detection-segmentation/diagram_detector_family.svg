<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 510" width="900" height="510"
     role="img" aria-labelledby="detFamilyTitle detFamilyDesc" font-family="Source Serif 4, Georgia, serif">
  <title id="detFamilyTitle">R-CNN, Fast R-CNN and Faster R-CNN</title>
  <desc id="detFamilyDesc">Three horizontal pipelines. The first runs a full backbone once per region after cropping the image. The second runs the backbone once on the whole image and crops its features, with proposals still supplied by an external dashed box. The third replaces that box with a region proposal network reading the same features.</desc>
  <text x="40.0" y="62.0" font-size="14" fill="currentColor" text-anchor="start" font-weight="600">R-CNN</text>
  <text x="40.0" y="79.0" font-size="11.5" fill="currentColor" text-anchor="start" fill-opacity="0.7">one backbone pass per region</text>
  <rect x="40.0" y="96.0" width="56.0" height="46.0" fill="#3b528b" fill-opacity="0.16" stroke="#3b528b" stroke-width="1.3" stroke-opacity="0.85" rx="6"/>
  <text x="68.0" y="123.5" font-size="12.5" fill="currentColor" text-anchor="middle">image</text>
  <rect x="132.0" y="96.0" width="118.0" height="46.0" fill="none" fill-opacity="1.0" stroke="#21918c" stroke-width="1.3" stroke-opacity="0.85" rx="6" stroke-dasharray="5 3"/>
  <text x="191.0" y="117.0" font-size="12.5" fill="currentColor" text-anchor="middle">selective search</text>
  <text x="191.0" y="132.0" font-size="10.5" fill="currentColor" text-anchor="middle" fill-opacity="0.7">CPU, not learned</text>
  <rect x="266.0" y="96.0" width="118.0" height="46.0" fill="#21918c" fill-opacity="0.16" stroke="#21918c" stroke-width="1.3" stroke-opacity="0.85" rx="6"/>
  <text x="325.0" y="117.0" font-size="12.5" fill="currentColor" text-anchor="middle">warp each crop</text>
  <text x="325.0" y="132.0" font-size="10.5" fill="currentColor" text-anchor="middle" fill-opacity="0.7">~2000 regions</text>
  <rect x="400.0" y="96.0" width="118.0" height="46.0" fill="#440154" fill-opacity="0.16" stroke="#440154" stroke-width="1.3" stroke-opacity="0.85" rx="6"/>
  <text x="459.0" y="117.0" font-size="12.5" fill="currentColor" text-anchor="middle">backbone CNN</text>
  <text x="459.0" y="132.0" font-size="10.5" fill="currentColor" text-anchor="middle" fill-opacity="0.7">× 2000</text>
  <rect x="534.0" y="96.0" width="118.0" height="46.0" fill="#21918c" fill-opacity="0.16" stroke="#21918c" stroke-width="1.3" stroke-opacity="0.85" rx="6"/>
