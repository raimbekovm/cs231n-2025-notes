<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430"
     role="img" aria-labelledby="segShapesTitle segShapesDesc" font-family="Source Serif 4, Georgia, serif">
  <title id="segShapesTitle">Constant-resolution and encoder-decoder fully convolutional networks</title>
  <desc id="segShapesDesc">Two horizontal pipelines of feature maps drawn as rectangles whose height is spatial size and width is channel count. In the upper pipeline every map has the full height of the input. In the lower pipeline the maps shrink in height and grow in width towards a bottleneck, then reverse, ending at the input's height again.</desc>
  <text x="40.0" y="32.0" font-size="14" fill="currentColor" text-anchor="start" font-weight="600">Constant resolution</text>
  <text x="40.0" y="50.0" font-size="11.5" fill="currentColor" text-anchor="start" fill-opacity="0.7">every layer is as wide as the image; the deepest receptive field is still small</text>
