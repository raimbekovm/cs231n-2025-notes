  <text x="814.0" y="85.5" font-size="12.5" fill="currentColor" text-anchor="middle">cat</text>
  <rect x="768.0" y="114.0" width="92.0" height="38.0" fill="#5ec962" fill-opacity="0.1" stroke="#5ec962" stroke-width="1.3" stroke-opacity="0.85" rx="6"/>
  <text x="814.0" y="137.5" font-size="12.5" fill="currentColor" text-anchor="middle">dog</text>
  <rect x="768.0" y="192.0" width="92.0" height="38.0" fill="#440154" fill-opacity="0.1" stroke="#440154" stroke-width="1.3" stroke-opacity="0.85" rx="6"/>
  <text x="814.0" y="209.0" font-size="12.5" fill="currentColor" text-anchor="middle">∅</text>
  <text x="814.0" y="224.0" font-size="10.5" fill="currentColor" text-anchor="middle" fill-opacity="0.7">unmatched</text>
