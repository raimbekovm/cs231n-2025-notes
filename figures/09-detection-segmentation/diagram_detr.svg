<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340"
     role="img" aria-labelledby="detrTitle detrDesc" font-family="Source Serif 4, Georgia, serif">
  <title id="detrTitle">DETR: detection as set prediction</title>
  <desc id="detrDesc">A left-to-right rail runs from the image through a convolutional backbone, a transformer encoder and a transformer decoder. A row of learned object queries enters the decoder from below and to the left. On the right, four predictions are matched one-to-one against two ground-truth objects, the two unmatched predictions being assigned the no-object class.</desc>
  <rect x="40.0" y="128.0" width="62.0" height="50.0" fill="#3b528b" fill-opacity="0.16" stroke="#3b528b" stroke-width="1.3" stroke-opacity="0.85" rx="6"/>
  <text x="71.0" y="157.5" font-size="12.5" fill="currentColor" text-anchor="middle">image</text>
  <rect x="128.0" y="128.0" width="96.0" height="50.0" fill="#21918c" fill-opacity="0.16" stroke="#21918c" stroke-width="1.3" stroke-opacity="0.85" rx="6"/>
  <text x="176.0" y="151.0" font-size="12.5" fill="currentColor" text-anchor="middle">backbone</text>
  <text x="176.0" y="166.0" font-size="10.5" fill="currentColor" text-anchor="middle" fill-opacity="0.7">CNN</text>
  <rect x="256.0" y="128.0" width="104.0" height="50.0" fill="#21918c" fill-opacity="0.16" stroke="#21918c" stroke-width="1.3" stroke-opacity="0.85" rx="6"/>
  <text x="308.0" y="151.0" font-size="12.5" fill="currentColor" text-anchor="middle">encoder</text>
  <text x="308.0" y="166.0" font-size="10.5" fill="currentColor" text-anchor="middle" fill-opacity="0.7">self-attention</text>
  <rect x="412.0" y="128.0" width="104.0" height="50.0" fill="#5ec962" fill-opacity="0.16" stroke="#5ec962" stroke-width="1.3" stroke-opacity="0.85" rx="6"/>
  <text x="464.0" y="151.0" font-size="12.5" fill="currentColor" text-anchor="middle">decoder</text>
  <text x="464.0" y="166.0" font-size="10.5" fill="currentColor" text-anchor="middle" fill-opacity="0.7">cross-attention</text>
  <line x1="106.0" y1="153.0" x2="118.0" y2="153.0" stroke="currentColor" stroke-width="1.2" stroke-opacity="0.55"/>
  <polygon points="124.0,153.0 118.0,155.7 118.0,150.3" fill="currentColor" fill-opacity="0.55" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <line x1="228.0" y1="153.0" x2="246.0" y2="153.0" stroke="currentColor" stroke-width="1.2" stroke-opacity="0.55"/>
  <polygon points="252.0,153.0 246.0,155.7 246.0,150.3" fill="currentColor" fill-opacity="0.55" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <line x1="364.0" y1="153.0" x2="402.0" y2="153.0" stroke="currentColor" stroke-width="1.2" stroke-opacity="0.55"/>
  <polygon points="408.0,153.0 402.0,155.7 402.0,150.3" fill="currentColor" fill-opacity="0.55" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <text x="184.0" y="114.0" font-size="11" fill="currentColor" text-anchor="middle" fill-opacity="0.7">+ positional encoding</text>
  <text x="340.0" y="226.0" font-size="11.5" fill="currentColor" text-anchor="middle" fill-opacity="0.85">N object queries</text>
  <rect x="288.0" y="236.0" width="20.0" height="30.0" fill="#3b528b" fill-opacity="0.35" stroke="#3b528b" stroke-width="1.0" stroke-opacity="0.9"/>
  <rect x="314.0" y="236.0" width="20.0" height="30.0" fill="#3b528b" fill-opacity="0.35" stroke="#3b528b" stroke-width="1.0" stroke-opacity="0.9"/>
  <rect x="340.0" y="236.0" width="20.0" height="30.0" fill="#3b528b" fill-opacity="0.35" stroke="#3b528b" stroke-width="1.0" stroke-opacity="0.9"/>
  <rect x="366.0" y="236.0" width="20.0" height="30.0" fill="#3b528b" fill-opacity="0.35" stroke="#3b528b" stroke-width="1.0" stroke-opacity="0.9"/>
  <text x="340.0" y="284.0" font-size="11" fill="currentColor" text-anchor="middle" fill-opacity="0.66">learned parameters, not image features</text>
  <line x1="392.0" y1="242.0" x2="421.2" y2="187.3" stroke="#3b528b" stroke-width="1.3" stroke-opacity="0.8"/>
