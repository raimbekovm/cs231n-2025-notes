  <polygon points="764.0,81.0 758.0,83.7 758.0,78.3" fill="#440154" fill-opacity="0.9" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <line x1="684.0" y1="133.0" x2="758.0" y2="133.0" stroke="#440154" stroke-width="1.5" stroke-opacity="0.9"/>
