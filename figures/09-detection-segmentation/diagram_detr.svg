  <line x1="684.0" y1="185.0" x2="758.3" y2="209.1" stroke="currentColor" stroke-width="1.1" stroke-opacity="0.5" stroke-dasharray="4 3"/>
  <polygon points="764.0,211.0 757.5,211.7 759.1,206.6" fill="currentColor" fill-opacity="0.5" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <line x1="684.0" y1="237.0" x2="758.3" y2="212.9" stroke="currentColor" stroke-width="1.1" stroke-opacity="0.5" stroke-dasharray="4 3"/>
