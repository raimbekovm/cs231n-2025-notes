  <rect x="566.0" y="114.0" width="116.0" height="38.0" fill="#5ec962" fill-opacity="0.16" stroke="#5ec962" stroke-width="1.3" stroke-opacity="0.85" rx="6"/>
  <text x="624.0" y="131.0" font-size="12.5" fill="currentColor" text-anchor="middle">dog</text>
  <text x="624.0" y="146.0" font-size="10.5" fill="currentColor" text-anchor="middle" fill-opacity="0.7">class + box</text>
  <rect x="566.0" y="166.0" width="116.0" height="38.0" fill="#440154" fill-opacity="0.16" stroke="#440154" stroke-width="1.3" stroke-opacity="0.85" rx="6"/>
  <text x="624.0" y="183.0" font-size="12.5" fill="currentColor" text-anchor="middle">∅</text>
  <text x="624.0" y="198.0" font-size="10.5" fill="currentColor" text-anchor="middle" fill-opacity="0.7">no object</text>
  <rect x="566.0" y="218.0" width="116.0" height="38.0" fill="#440154" fill-opacity="0.16" stroke="#440154" stroke-width="1.3" stroke-opacity="0.85" rx="6"/>
  <text x="624.0" y="235.0" font-size="12.5" fill="currentColor" text-anchor="middle">∅</text>
  <text x="624.0" y="250.0" font-size="10.5" fill="currentColor" text-anchor="middle" fill-opacity="0.7">no object</text>
