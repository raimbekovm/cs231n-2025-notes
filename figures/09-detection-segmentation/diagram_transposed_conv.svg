  <polygon points="523.0,202.0 520.3,196.0 525.7,196.0" fill="currentColor" fill-opacity="0.4" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <rect x="552.0" y="206.0" width="58.0" height="58.0" fill="none" fill-opacity="0.22" stroke="currentColor" stroke-width="1.2" stroke-opacity="0.6"/>
  <text x="581.0" y="240.0" font-size="14" fill="currentColor" text-anchor="middle">ay</text>
  <line x1="581.0" y1="116.0" x2="581.0" y2="196.0" stroke="currentColor" stroke-width="1.0" stroke-opacity="0.4"/>
  <polygon points="581.0,202.0 578.3,196.0 583.7,196.0" fill="currentColor" fill-opacity="0.4" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <rect x="610.0" y="206.0" width="58.0" height="58.0" fill="#440154" fill-opacity="0.22" stroke="currentColor" stroke-width="1.2" stroke-opacity="0.6"/>
  <text x="639.0" y="240.0" font-size="12.5" fill="currentColor" text-anchor="middle">az + bx</text>
  <line x1="639.0" y1="180.0" x2="639.0" y2="196.0" stroke="currentColor" stroke-width="1.0" stroke-opacity="0.4"/>
  <polygon points="639.0,202.0 636.3,196.0 641.7,196.0" fill="currentColor" fill-opacity="0.4" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <rect x="668.0" y="206.0" width="58.0" height="58.0" fill="none" fill-opacity="0.22" stroke="currentColor" stroke-width="1.2" stroke-opacity="0.6"/>
  <text x="697.0" y="240.0" font-size="14" fill="currentColor" text-anchor="middle">by</text>
  <line x1="697.0" y1="180.0" x2="697.0" y2="196.0" stroke="currentColor" stroke-width="1.0" stroke-opacity="0.4"/>
  <polygon points="697.0,202.0 694.3,196.0 699.7,196.0" fill="currentColor" fill-opacity="0.4" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <rect x="726.0" y="206.0" width="58.0" height="58.0" fill="none" fill-opacity="0.22" stroke="currentColor" stroke-width="1.2" stroke-opacity="0.6"/>
  <text x="755.0" y="240.0" font-size="14" fill="currentColor" text-anchor="middle">bz</text>
  <line x1="755.0" y1="180.0" x2="755.0" y2="196.0" stroke="currentColor" stroke-width="1.0" stroke-opacity="0.4"/>
  <polygon points="755.0,202.0 752.3,196.0 757.7,196.0" fill="currentColor" fill-opacity="0.4" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <text x="480.0" y="240.0" font-size="11.5" fill="currentColor" text-anchor="end" fill-opacity="0.8">sum</text>
  <text x="639.0" y="288.0" font-size="11.5" fill="currentColor" text-anchor="middle" fill-opacity="0.72">5 values — the filter moves 2 output cells per input cell</text>
  <text x="639.0" y="308.0" font-size="11" fill="currentColor" text-anchor="middle" fill-opacity="0.6">only the shaded cell was reached by both copies</text>
</svg>
