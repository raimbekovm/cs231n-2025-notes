  <text x="231.0" y="277.0" font-size="13" fill="currentColor" text-anchor="middle" font-style="italic">F₂</text>
  <line x1="272.0" y1="272.0" x2="318.0" y2="272.0" stroke="currentColor" stroke-width="1.4" stroke-opacity="0.75"/>
  <polygon points="324.0,272.0 318.0,274.7 318.0,269.3" fill="currentColor" fill-opacity="0.75" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <rect x="328.0" y="252.0" width="74.0" height="40.0" fill="#440154" fill-opacity="0.2" stroke="currentColor" stroke-width="0.9" stroke-opacity="0.4" rx="3"/>
  <text x="365.0" y="277.0" font-size="13" fill="currentColor" text-anchor="middle" font-style="italic">X̂₁</text>
  <text x="97.0" y="168.0" font-size="11" fill="currentColor" text-anchor="middle" fill-opacity="0.6">lightness L</text>
  <text x="97.0" y="316.0" font-size="11" fill="currentColor" text-anchor="middle" fill-opacity="0.6">colour ab</text>
  <line x1="240.0" y1="218.0" x2="446.0" y2="225.8" stroke="currentColor" stroke-width="1.4" stroke-opacity="0.6"/>
  <polygon points="452.0,226.0 445.9,228.5 446.1,223.1" fill="currentColor" fill-opacity="0.6" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <line x1="240.0" y1="250.0" x2="446.0" y2="242.2" stroke="currentColor" stroke-width="1.4" stroke-opacity="0.6"/>
