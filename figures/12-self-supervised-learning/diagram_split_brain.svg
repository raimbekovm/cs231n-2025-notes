  <text x="508.0" y="246.0" font-size="12" fill="currentColor" text-anchor="middle" font-style="italic">F₁ ⊕ F₂</text>
  <line x1="564.0" y1="234.0" x2="594.0" y2="234.0" stroke="currentColor" stroke-width="1.4" stroke-opacity="0.75"/>
  <polygon points="600.0,234.0 594.0,236.7 594.0,231.3" fill="currentColor" fill-opacity="0.75" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <text x="606.0" y="230.0" font-size="12" fill="currentColor" text-anchor="start">representation</text>
  <text x="606.0" y="248.0" font-size="11.5" fill="currentColor" text-anchor="start" fill-opacity="0.65">of the whole tensor</text>
</svg>
