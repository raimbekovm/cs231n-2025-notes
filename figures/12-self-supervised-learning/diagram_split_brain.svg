<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 336" width="760" height="336"
     role="img" aria-labelledby="sbTitle sbDesc" font-family="Source Serif 4, Georgia, serif">
  <title id="sbTitle">The split-brain autoencoder</title>
  <desc id="sbDesc">A small reference row showing a plain autoencoder reconstructing its own input, and below it two parallel lanes in which one network predicts the colour channels from lightness and another predicts lightness from colour, their representations concatenated into a single feature.</desc>
  <text x="20.0" y="26.0" font-size="12.5" fill="currentColor" text-anchor="start">Autoencoder — the target is visible to the network</text>
  <rect x="30.0" y="58.0" width="66.0" height="40.0" fill="#1b1b1b" fill-opacity="0.06" stroke="currentColor" stroke-width="0.9" stroke-opacity="0.35" rx="3"/>
  <text x="63.0" y="82.0" font-size="13" fill="currentColor" text-anchor="middle" font-style="italic">X</text>
  <line x1="100.0" y1="78.0" x2="134.0" y2="78.0" stroke="currentColor" stroke-width="1.4" stroke-opacity="0.75"/>
  <polygon points="140.0,78.0 134.0,80.7 134.0,75.3" fill="currentColor" fill-opacity="0.75" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <rect x="144.0" y="58.0" width="66.0" height="40.0" fill="#1b1b1b" fill-opacity="0.1" stroke="currentColor" stroke-width="0.9" stroke-opacity="0.35" rx="3"/>
  <text x="177.0" y="82.0" font-size="13" fill="currentColor" text-anchor="middle" font-style="italic">F</text>
  <line x1="214.0" y1="78.0" x2="248.0" y2="78.0" stroke="currentColor" stroke-width="1.4" stroke-opacity="0.75"/>
  <polygon points="254.0,78.0 248.0,80.7 248.0,75.3" fill="currentColor" fill-opacity="0.75" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <rect x="258.0" y="58.0" width="66.0" height="40.0" fill="#1b1b1b" fill-opacity="0.06" stroke="currentColor" stroke-width="0.9" stroke-opacity="0.35" rx="3"/>
  <text x="291.0" y="82.0" font-size="13" fill="currentColor" text-anchor="middle" font-style="italic">X̂</text>
  <text x="344.0" y="82.0" font-size="11.5" fill="currentColor" text-anchor="start" fill-opacity="0.6">— nothing rules out copying</text>
  <line x1="20.0" y1="122.0" x2="740.0" y2="122.0" stroke="currentColor" stroke-width="1.0" stroke-opacity="0.25" stroke-dasharray="6 5"/>
  <text x="20.0" y="148.0" font-size="12.5" fill="currentColor" text-anchor="start">Split-brain — each half predicts what it cannot see</text>
  <rect x="60.0" y="176.0" width="74.0" height="40.0" fill="#21918c" fill-opacity="0.2" stroke="currentColor" stroke-width="0.9" stroke-opacity="0.4" rx="3"/>
  <text x="97.0" y="201.0" font-size="13" fill="currentColor" text-anchor="middle" font-style="italic">X₁</text>
  <line x1="138.0" y1="196.0" x2="184.0" y2="196.0" stroke="currentColor" stroke-width="1.4" stroke-opacity="0.75"/>
  <polygon points="190.0,196.0 184.0,198.7 184.0,193.3" fill="currentColor" fill-opacity="0.75" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <rect x="194.0" y="176.0" width="74.0" height="40.0" fill="#21918c" fill-opacity="0.36" stroke="currentColor" stroke-width="0.9" stroke-opacity="0.4" rx="3"/>
  <text x="231.0" y="201.0" font-size="13" fill="currentColor" text-anchor="middle" font-style="italic">F₁</text>
