  <rect x="328.0" y="176.0" width="74.0" height="40.0" fill="#21918c" fill-opacity="0.2" stroke="currentColor" stroke-width="0.9" stroke-opacity="0.4" rx="3"/>
  <text x="365.0" y="201.0" font-size="13" fill="currentColor" text-anchor="middle" font-style="italic">X̂₂</text>
  <rect x="60.0" y="252.0" width="74.0" height="40.0" fill="#440154" fill-opacity="0.2" stroke="currentColor" stroke-width="0.9" stroke-opacity="0.4" rx="3"/>
  <text x="97.0" y="277.0" font-size="13" fill="currentColor" text-anchor="middle" font-style="italic">X₂</text>
