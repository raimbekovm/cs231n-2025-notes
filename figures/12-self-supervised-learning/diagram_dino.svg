  <title id="dnTitle">DINO's self-distillation and collapse avoidance</title>
  <desc id="dnDesc">Above, one image producing two views for a student and a momentum teacher whose output is centred and sharpened before a cross-entropy loss; below, three output histograms showing collapse to a single dimension, the structured output that is wanted, and collapse to uniform, with arrows marking which correction pushes away from which collapse.</desc>
