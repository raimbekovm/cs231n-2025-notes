<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 344" width="760" height="344"
     role="img" aria-labelledby="trTitle trDesc" font-family="Source Serif 4, Georgia, serif">
  <title id="trTitle">Three transformation pretext tasks</title>
  <desc id="trDesc">On the left, one asymmetric glyph shown at four right-angle rotations with the class index below each. On the right, a three-by-three patch grid with the centre marked as reference and the eight neighbours numbered, and beneath it a shuffled row of nine tiles feeding a permutation index.</desc>
  <text x="20.0" y="28.0" font-size="13" fill="currentColor" text-anchor="start">Rotation — four classes</text>
  <text x="430.0" y="28.0" font-size="13" fill="currentColor" text-anchor="start">Patch position and permutation</text>
  <rect x="24.0" y="54.0" width="62.0" height="62.0" fill="#3b528b" fill-opacity="0.1" stroke="currentColor" stroke-width="0.9" stroke-opacity="0.45" rx="2"/>
  <polygon points="37.6,102.4 37.6,68.9 51.3,68.9 51.3,90.0 71.1,90.0 71.1,102.4" fill="#21918c" fill-opacity="0.8" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <text x="55.0" y="134.0" font-size="12" fill="currentColor" text-anchor="middle">0°</text>
  <text x="55.0" y="151.0" font-size="11.5" fill="currentColor" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" fill-opacity="0.65">y = 0</text>
  <rect x="110.0" y="54.0" width="62.0" height="62.0" fill="#3b528b" fill-opacity="0.1" stroke="currentColor" stroke-width="0.9" stroke-opacity="0.45" rx="2"/>
  <polygon points="123.6,67.6 157.1,67.6 157.1,81.3 136.0,81.3 136.0,101.1 123.6,101.1" fill="#21918c" fill-opacity="0.8" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <text x="141.0" y="134.0" font-size="12" fill="currentColor" text-anchor="middle">90°</text>
  <text x="141.0" y="151.0" font-size="11.5" fill="currentColor" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" fill-opacity="0.65">y = 1</text>
  <rect x="196.0" y="54.0" width="62.0" height="62.0" fill="#3b528b" fill-opacity="0.1" stroke="currentColor" stroke-width="0.9" stroke-opacity="0.45" rx="2"/>
  <polygon points="244.4,67.6 244.4,101.1 230.7,101.1 230.7,80.0 210.9,80.0 210.9,67.6" fill="#21918c" fill-opacity="0.8" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
