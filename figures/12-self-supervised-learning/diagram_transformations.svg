  <rect x="282.0" y="54.0" width="62.0" height="62.0" fill="#3b528b" fill-opacity="0.1" stroke="currentColor" stroke-width="0.9" stroke-opacity="0.45" rx="2"/>
  <polygon points="330.4,102.4 296.9,102.4 296.9,88.7 318.0,88.7 318.0,68.9 330.4,68.9" fill="#21918c" fill-opacity="0.8" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <text x="313.0" y="134.0" font-size="12" fill="currentColor" text-anchor="middle">270°</text>
  <text x="313.0" y="151.0" font-size="11.5" fill="currentColor" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" fill-opacity="0.65">y = 3</text>
  <text x="24.0" y="192.0" font-size="11.5" fill="currentColor" text-anchor="start" fill-opacity="0.65">The label is drawn first; the image is manufactured from it.</text>
  <text x="24.0" y="210.0" font-size="11.5" fill="currentColor" text-anchor="start" fill-opacity="0.65">No local statistic of a photograph reveals which way is up,</text>
  <text x="24.0" y="228.0" font-size="11.5" fill="currentColor" text-anchor="start" fill-opacity="0.65">so the arrangement of the object's parts has to be encoded.</text>
