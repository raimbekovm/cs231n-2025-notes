<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 336" width="760" height="336"
     role="img" aria-labelledby="inTitle inDesc" font-family="Source Serif 4, Georgia, serif">
  <title id="inTitle">The InfoNCE objective</title>
  <desc id="inDesc">On the left, an anchor point in embedding space with a positive being pulled toward it and five negatives being pushed away; on the right, the same situation as a bar chart of softmax probability mass with the positive holding most of it.</desc>
  <text x="20.0" y="26.0" font-size="13" fill="currentColor" text-anchor="start">One anchor, one positive, N − 1 negatives</text>
  <circle cx="130.0" cy="130.0" r="13.0" fill="#3b528b" fill-opacity="0.9" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <text x="130.0" y="164.0" font-size="12" fill="currentColor" text-anchor="middle">anchor</text>
  <text x="130.0" y="180.0" font-size="11.5" fill="currentColor" text-anchor="middle" font-style="italic" fill-opacity="0.7">f(x)</text>
  <circle cx="206.0" cy="88.0" r="11.0" fill="#5ec962" fill-opacity="0.9" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <text x="226.0" y="82.0" font-size="12" fill="currentColor" text-anchor="start">positive</text>
  <text x="226.0" y="98.0" font-size="11" fill="currentColor" text-anchor="start" fill-opacity="0.65">another view of x</text>
  <line x1="200.0" y1="98.0" x2="147.6" y2="117.9" stroke="#5ec962" stroke-width="1.8" stroke-opacity="0.95"/>
  <polygon points="142.0,120.0 146.7,115.3 148.6,120.4" fill="#5ec962" fill-opacity="0.95" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <circle cx="268.0" cy="176.0" r="10.0" fill="#440154" fill-opacity="0.75" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <line x1="268.0" y1="176.0" x2="285.1" y2="181.7" stroke="#440154" stroke-width="1.4" stroke-opacity="0.8"/>
  <polygon points="290.8,183.6 284.2,184.3 285.9,179.1" fill="#440154" fill-opacity="0.8" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <circle cx="232.0" cy="232.0" r="10.0" fill="#440154" fill-opacity="0.75" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <line x1="232.0" y1="232.0" x2="244.7" y2="244.7" stroke="#440154" stroke-width="1.4" stroke-opacity="0.8"/>
