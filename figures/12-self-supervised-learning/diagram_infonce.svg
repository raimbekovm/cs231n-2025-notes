  <rect x="552.0" y="232.5" width="46.0" height="17.5" fill="#440154" fill-opacity="0.45" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <text x="575.0" y="268.0" font-size="11.5" fill="currentColor" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" fill-opacity="0.8">x⁻3</text>
  <rect x="612.0" y="235.0" width="46.0" height="15.0" fill="#440154" fill-opacity="0.45" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <text x="635.0" y="268.0" font-size="11.5" fill="currentColor" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" fill-opacity="0.8">x⁻4</text>
  <rect x="672.0" y="237.5" width="46.0" height="12.5" fill="#440154" fill-opacity="0.45" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <text x="695.0" y="268.0" font-size="11.5" fill="currentColor" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" fill-opacity="0.8">x⁻5</text>
  <line x1="362.0" y1="250.0" x2="732.0" y2="250.0" stroke="currentColor" stroke-width="1.0" stroke-opacity="0.35"/>
  <text x="360.0" y="286.0" font-size="11.5" fill="currentColor" text-anchor="start" fill-opacity="0.7">softmax mass; the loss is −log of the first bar</text>
  <text x="360.0" y="312.0" font-size="11.5" fill="currentColor" text-anchor="start" fill-opacity="0.65">A negative already far away contributes almost nothing to the gradient.</text>
</svg>
