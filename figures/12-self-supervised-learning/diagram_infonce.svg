  <circle cx="144.0" cy="244.0" r="10.0" fill="#440154" fill-opacity="0.75" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <line x1="144.0" y1="244.0" x2="146.2" y2="261.9" stroke="#440154" stroke-width="1.4" stroke-opacity="0.8"/>
  <polygon points="146.9,267.8 143.5,262.2 148.9,261.5" fill="#440154" fill-opacity="0.8" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <circle cx="72.0" cy="210.0" r="10.0" fill="#440154" fill-opacity="0.75" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <line x1="72.0" y1="210.0" x2="61.4" y2="224.6" stroke="#440154" stroke-width="1.4" stroke-opacity="0.8"/>
  <polygon points="57.9,229.4 59.2,223.0 63.6,226.2" fill="#440154" fill-opacity="0.8" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <circle cx="60.0" cy="74.0" r="10.0" fill="#440154" fill-opacity="0.75" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <line x1="60.0" y1="74.0" x2="45.9" y2="62.8" stroke="#440154" stroke-width="1.4" stroke-opacity="0.8"/>
  <polygon points="41.3,59.0 47.6,60.6 44.3,64.9" fill="#440154" fill-opacity="0.8" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <text x="176.0" y="302.0" font-size="11.5" fill="#440154" text-anchor="middle">negatives — pushed away</text>
  <line x1="330.0" y1="44.0" x2="330.0" y2="300.0" stroke="currentColor" stroke-width="1.0" stroke-opacity="0.22" stroke-dasharray="4 5"/>
  <text x="360.0" y="26.0" font-size="13" fill="currentColor" text-anchor="start">which is an N-way classification</text>
