<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 306" width="760" height="306"
     role="img" aria-labelledby="lcTitle lcDesc" font-family="Source Serif 4, Georgia, serif">
  <title id="lcTitle">Annotation effort per image</title>
  <desc id="lcDesc">Horizontal bars on a logarithmic axis showing aggregate worker-minutes per image for three COCO annotation stages and two Cityscapes annotation tiers, spanning from under two minutes to ninety.</desc>
  <text x="20.0" y="30.0" font-size="14" fill="currentColor" text-anchor="start">Human annotation effort per image</text>
  <text x="20.0" y="50.0" font-size="11.5" fill="currentColor" text-anchor="start" fill-opacity="0.6">aggregate worker-minutes, logarithmic scale</text>
  <line x1="300.0" y1="68.0" x2="300.0" y2="250.0" stroke="currentColor" stroke-width="1.0" stroke-opacity="0.16" stroke-dasharray="3 4"/>
  <text x="300.0" y="268.0" font-size="11" fill="currentColor" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" fill-opacity="0.6">1</text>
  <line x1="396.9" y1="68.0" x2="396.9" y2="250.0" stroke="currentColor" stroke-width="1.0" stroke-opacity="0.16" stroke-dasharray="3 4"/>
  <text x="396.9" y="268.0" font-size="11" fill="currentColor" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" fill-opacity="0.6">3</text>
  <line x1="503.0" y1="68.0" x2="503.0" y2="250.0" stroke="currentColor" stroke-width="1.0" stroke-opacity="0.16" stroke-dasharray="3 4"/>
  <text x="503.0" y="268.0" font-size="11" fill="currentColor" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" fill-opacity="0.6">10</text>
  <line x1="599.9" y1="68.0" x2="599.9" y2="250.0" stroke="currentColor" stroke-width="1.0" stroke-opacity="0.16" stroke-dasharray="3 4"/>
  <text x="599.9" y="268.0" font-size="11" fill="currentColor" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" fill-opacity="0.6">30</text>
  <line x1="706.0" y1="68.0" x2="706.0" y2="250.0" stroke="currentColor" stroke-width="1.0" stroke-opacity="0.16" stroke-dasharray="3 4"/>
  <text x="706.0" y="268.0" font-size="11" fill="currentColor" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" fill-opacity="0.6">100</text>
  <text x="503.0" y="290.0" font-size="11.5" fill="currentColor" text-anchor="middle" fill-opacity="0.6">minutes</text>
  <text x="286.0" y="92.0" font-size="12" fill="currentColor" text-anchor="end">COCO — which categories are present</text>
  <rect x="300.0" y="78.0" width="114.4" height="20.0" fill="#3b528b" fill-opacity="0.82" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <text x="422.4" y="92.0" font-size="11.5" fill="currentColor" text-anchor="start" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace">3.7</text>
  <text x="286.0" y="126.0" font-size="12" fill="currentColor" text-anchor="end">COCO — where each instance is</text>
  <rect x="300.0" y="112.0" width="53.2" height="20.0" fill="#3b528b" fill-opacity="0.82" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <text x="361.2" y="126.0" font-size="11.5" fill="currentColor" text-anchor="start" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace">1.8</text>
  <text x="286.0" y="160.0" font-size="12" fill="currentColor" text-anchor="end">COCO — outline of every instance</text>
  <rect x="300.0" y="146.0" width="203.5" height="20.0" fill="#3b528b" fill-opacity="0.82" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <text x="511.5" y="160.0" font-size="11.5" fill="currentColor" text-anchor="start" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace">10.1</text>
  <text x="286.0" y="194.0" font-size="12" fill="currentColor" text-anchor="end">Cityscapes — coarse polygons</text>
  <rect x="300.0" y="180.0" width="171.6" height="20.0" fill="#440154" fill-opacity="0.82" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <text x="479.6" y="194.0" font-size="11.5" fill="currentColor" text-anchor="start" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace">7.0</text>
  <text x="286.0" y="228.0" font-size="12" fill="currentColor" text-anchor="end">Cityscapes — every pixel, with review</text>
  <rect x="300.0" y="214.0" width="396.7" height="20.0" fill="#440154" fill-opacity="0.82" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <text x="704.7" y="228.0" font-size="11.5" fill="currentColor" text-anchor="start" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace">90.0</text>
  <line x1="300.0" y1="68.0" x2="300.0" y2="250.0" stroke="currentColor" stroke-width="1.0" stroke-opacity="0.35"/>
</svg>
