  <polygon points="133.0,138.0 126.5,137.4 129.1,132.7" fill="currentColor" fill-opacity="0.6" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <line x1="98.0" y1="172.0" x2="127.8" y2="155.0" stroke="currentColor" stroke-width="1.4" stroke-opacity="0.6"/>
