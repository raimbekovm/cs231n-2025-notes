  <text x="195.0" y="62.0" font-size="12.5" fill="currentColor" text-anchor="middle">sampling in the path</text>
  <text x="195.0" y="80.0" font-size="11" fill="currentColor" text-anchor="middle" fill-opacity="0.6">no gradient reaches &#956; or &#963;</text>
  <rect x="52.0" y="100.0" width="46.0" height="30.0" fill="#3b528b" fill-opacity="0.14" stroke="#3b528b" stroke-width="1.0" stroke-opacity="0.6" rx="4"/>
  <text x="75.0" y="120.0" font-size="13" fill="currentColor" text-anchor="middle">&#956;</text>
  <rect x="52.0" y="160.0" width="46.0" height="30.0" fill="#3b528b" fill-opacity="0.14" stroke="#3b528b" stroke-width="1.0" stroke-opacity="0.6" rx="4"/>
  <text x="75.0" y="180.0" font-size="13" fill="currentColor" text-anchor="middle">&#963;</text>
