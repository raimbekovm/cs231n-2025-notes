<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" width="760" height="290"
     role="img" aria-labelledby="rpTitle rpDesc" font-family="Source Serif 4, Georgia, serif">
  <title id="rpTitle">The reparameterisation trick as two computation graphs</title>
  <desc id="rpDesc">On the left, the mean and standard deviation feed a sampling node which produces the code, and the backward path is drawn crossed out at the sampling node. On the right, the standard deviation is multiplied by an independent noise input and the mean is added, giving the same code, and the backward path runs all the way back to both parameters.</desc>
  <text x="20.0" y="28.0" font-size="14" fill="currentColor" text-anchor="start">Where the randomness sits</text>
