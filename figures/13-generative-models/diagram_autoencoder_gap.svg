  <title id="agTitle">The autoencoder's missing latent distribution</title>
  <desc id="agDesc">Above, a pipeline from an image through an encoder to a code and back through a decoder to a reconstruction, with a dashed reconstruction loss joining the two ends. Below, a box representing latent space holds a curved cluster of the codes training produced, and a cross marks a randomly drawn code well outside the cluster, whose path through the decoder ends in a question mark.</desc>
