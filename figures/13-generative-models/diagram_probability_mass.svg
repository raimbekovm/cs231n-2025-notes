<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330"
     role="img" aria-labelledby="pmTitle pmDesc" font-family="Source Serif 4, Georgia, serif">
  <title id="pmTitle">Two directions of normalisation</title>
  <desc id="pmDesc">On the left, three stacked bars, one per input image, each summing to one across the cat and dog labels, so the monkey photograph must still be split between them. On the right, four bars whose heights sum to one across the images, so the abstract art can be given almost no mass.</desc>
  <text x="20.0" y="28.0" font-size="14" fill="currentColor" text-anchor="start">Which direction sums to one</text>
  <text x="20.0" y="48.0" font-size="11.5" fill="currentColor" text-anchor="start" fill-opacity="0.6">the same total, apportioned along different axes</text>
  <line x1="380.0" y1="70.0" x2="380.0" y2="300.0" stroke="currentColor" stroke-width="1.0" stroke-opacity="0.14" stroke-dasharray="4 5"/>
  <text x="190.0" y="88.0" font-size="12.5" fill="currentColor" text-anchor="middle">discriminative  p(y | x)</text>
  <rect x="60.0" y="110.0" width="60.0" height="11.2" fill="#3b528b" fill-opacity="0.78" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <rect x="60.0" y="121.2" width="60.0" height="128.8" fill="#5ec962" fill-opacity="0.78" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <rect x="60.0" y="110.0" width="60.0" height="140.0" fill="none" fill-opacity="1.0" stroke="currentColor" stroke-width="1.0" stroke-opacity="0.3"/>
  <text x="90.0" y="189.6" font-size="11" fill="#1b1b1b" text-anchor="middle" fill-opacity="0.8">cat</text>
  <text x="90.0" y="268.0" font-size="11" fill="currentColor" text-anchor="middle" fill-opacity="0.7">cat photo</text>
  <rect x="160.0" y="110.0" width="60.0" height="63.0" fill="#3b528b" fill-opacity="0.78" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <rect x="160.0" y="173.0" width="60.0" height="77.0" fill="#5ec962" fill-opacity="0.78" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <rect x="160.0" y="110.0" width="60.0" height="140.0" fill="none" fill-opacity="1.0" stroke="currentColor" stroke-width="1.0" stroke-opacity="0.3"/>
  <text x="190.0" y="215.5" font-size="11" fill="#1b1b1b" text-anchor="middle" fill-opacity="0.8">cat</text>
  <text x="190.0" y="145.5" font-size="11" fill="#1b1b1b" text-anchor="middle" fill-opacity="0.8">dog</text>
  <text x="190.0" y="268.0" font-size="11" fill="currentColor" text-anchor="middle" fill-opacity="0.7">monkey photo</text>
  <rect x="260.0" y="110.0" width="60.0" height="133.0" fill="#3b528b" fill-opacity="0.78" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <rect x="260.0" y="243.0" width="60.0" height="7.0" fill="#5ec962" fill-opacity="0.78" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <rect x="260.0" y="110.0" width="60.0" height="140.0" fill="none" fill-opacity="1.0" stroke="currentColor" stroke-width="1.0" stroke-opacity="0.3"/>
  <text x="290.0" y="180.5" font-size="11" fill="#1b1b1b" text-anchor="middle" fill-opacity="0.8">dog</text>
  <text x="290.0" y="268.0" font-size="11" fill="currentColor" text-anchor="middle" fill-opacity="0.7">dog photo</text>
  <text x="190.0" y="292.0" font-size="11.5" fill="#3b528b" text-anchor="middle">each column sums to 1</text>
  <text x="570.0" y="88.0" font-size="12.5" fill="currentColor" text-anchor="middle">generative  p(x)</text>
  <rect x="428.0" y="110.0" width="44.0" height="140.0" fill="#440154" fill-opacity="0.78" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <text x="450.0" y="268.0" font-size="11" fill="currentColor" text-anchor="middle" fill-opacity="0.7">cat</text>
  <rect x="493.0" y="117.0" width="44.0" height="133.0" fill="#440154" fill-opacity="0.78" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <text x="515.0" y="268.0" font-size="11" fill="currentColor" text-anchor="middle" fill-opacity="0.7">dog</text>
  <rect x="558.0" y="180.0" width="44.0" height="70.0" fill="#440154" fill-opacity="0.78" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <text x="580.0" y="268.0" font-size="11" fill="currentColor" text-anchor="middle" fill-opacity="0.7">monkey</text>
  <rect x="623.0" y="243.0" width="44.0" height="7.0" fill="#440154" fill-opacity="0.78" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <text x="645.0" y="268.0" font-size="11" fill="currentColor" text-anchor="middle" fill-opacity="0.7">art</text>
  <line x1="428.0" y1="250.0" x2="668.0" y2="250.0" stroke="currentColor" stroke-width="1.0" stroke-opacity="0.35"/>
  <text x="570.0" y="292.0" font-size="11.5" fill="#440154" text-anchor="middle">the four bars sum to 1</text>
</svg>
