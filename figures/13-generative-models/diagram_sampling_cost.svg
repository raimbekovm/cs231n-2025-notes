  <title id="scTitle">Sampling cost against image resolution</title>
  <desc id="scDesc">A straight line on log-log axes showing sequential decoder evaluations per sample rising quadratically with image side length, from about three thousand passes at thirty-two pixels square to over three million at one thousand and twenty-four pixels square.</desc>
