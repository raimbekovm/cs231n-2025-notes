<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250"
     role="img" aria-labelledby="vdTitle vdDesc" font-family="Source Serif 4, Georgia, serif">
  <title id="vdTitle">Generative and inference directions</title>
  <desc id="vdDesc">A box for the latent code on the left and a box for the image on the right. A solid arrow from code to image is labelled as the decoder, a network that can be evaluated. A dashed arrow from image back to code is labelled as the posterior, which needs the intractable integral.</desc>
  <text x="20.0" y="28.0" font-size="14" fill="currentColor" text-anchor="start">One model, two directions</text>
  <rect x="115.0" y="127.0" width="130.0" height="46.0" fill="#3b528b" fill-opacity="0.14" stroke="#3b528b" stroke-width="1.0" stroke-opacity="0.6" rx="4"/>
  <text x="180.0" y="150.0" font-size="16" fill="currentColor" text-anchor="middle">z</text>
  <text x="180.0" y="166.0" font-size="11" fill="currentColor" text-anchor="middle" fill-opacity="0.65">latent code</text>
  <rect x="515.0" y="127.0" width="130.0" height="46.0" fill="#21918c" fill-opacity="0.14" stroke="#21918c" stroke-width="1.0" stroke-opacity="0.6" rx="4"/>
  <text x="580.0" y="150.0" font-size="16" fill="currentColor" text-anchor="middle">x</text>
  <text x="580.0" y="166.0" font-size="11" fill="currentColor" text-anchor="middle" fill-opacity="0.65">image</text>
  <text x="180.0" y="196.0" font-size="11" fill="currentColor" text-anchor="middle" fill-opacity="0.65">prior p(z) = N(0, I)</text>
  <line x1="250.0" y1="120.0" x2="504.0" y2="120.0" stroke="#21918c" stroke-width="1.8" stroke-opacity="0.85"/>
  <polygon points="510.0,120.0 504.0,122.7 504.0,117.3" fill="#21918c" fill-opacity="0.85" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <text x="380.0" y="108.0" font-size="12.5" fill="#21918c" text-anchor="middle">decoder  p(x | z)</text>
  <text x="380.0" y="90.0" font-size="11" fill="currentColor" text-anchor="middle" fill-opacity="0.6">a network we can evaluate</text>
  <line x1="510.0" y1="182.0" x2="256.0" y2="182.0" stroke="#440154" stroke-width="1.8" stroke-opacity="0.85" stroke-dasharray="6 4"/>
  <polygon points="250.0,182.0 256.0,179.3 256.0,184.7" fill="#440154" fill-opacity="0.85" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <text x="380.0" y="202.0" font-size="12.5" fill="#440154" text-anchor="middle">posterior  p(z | x)</text>
  <text x="380.0" y="220.0" font-size="11" fill="currentColor" text-anchor="middle" fill-opacity="0.6">needs the intractable integral</text>
</svg>
