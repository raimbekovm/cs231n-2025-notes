  <title id="klTitle">Best Gaussian fit under each direction of the KL divergence</title>
  <desc id="klDesc">Two panels, each showing the same bimodal target density and the single Gaussian that best fits it. Under the forward divergence the fit is broad and centred in the valley between the two modes. Under the reverse divergence the fit is narrow and sits on one mode, ignoring the other.</desc>
