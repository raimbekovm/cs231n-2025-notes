  <title id="stTitle">The two ELBO terms in tension</title>
  <desc id="stDesc">Reconstruction cost rises steadily with the encoder's predicted standard deviation while the prior divergence falls to a minimum at one and rises again, and their sum has an interior minimum at about zero point six two five, marked, which is the standard deviation of the true posterior.</desc>
  <text x="20.0" y="28.0" font-size="14" fill="currentColor" text-anchor="start">The two terms of the ELBO, against &#963;</text>
  <text x="20.0" y="48.0" font-size="11.5" fill="currentColor" text-anchor="start" fill-opacity="0.6">one-dimensional model, x = 1.3, decoder noise &#963;&#8339; = 0.8; nats, constants dropped</text>
