<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="pipelineTitle pipelineDesc">
  <title id="pipelineTitle">The training pipeline for a linear image classifier</title>
  <desc id="pipelineDesc">An image is flattened into a vector, mapped by weights and a bias to class scores, and compared with its label by a loss function.</desc>
  <defs>
    <marker id="pipelineArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#424242"/></marker>
    <style>
      .box { stroke: #424242; stroke-width: 2; }
      .label { font-family: 'Space Grotesk', sans-serif; font-size: 22px; fill: #212121; text-anchor: middle; }
      .label-inv { font-family: 'Space Grotesk', sans-serif; font-size: 22px; fill: #ffffff; text-anchor: middle; }
      .small { font-family: 'Source Serif 4', Georgia, serif; font-size: 18px; fill: #1b1b1b; text-anchor: middle; }
      .small-inv { font-family: 'Source Serif 4', Georgia, serif; font-size: 18px; fill: #ffffff; text-anchor: middle; }
      .caption { font-family: 'Source Serif 4', Georgia, serif; font-size: 18px; fill: #424242; text-anchor: middle; }
      .arrow { stroke: #424242; stroke-width: 3; fill: none; marker-end: url(#pipelineArrow); }
    </style>
  </defs>
  <rect width="1200" height="430" fill="#fbfbfb"/>
  <text x="600" y="48" class="label" font-size="26">From an image to a training signal</text>

  <rect x="55" y="125" width="190" height="150" rx="16" class="box" fill="#440154"/>
  <g stroke="#fde725" stroke-width="5" opacity=".9"><path d="M78 150h144M78 180h144M78 210h144M78 240h144"/><path d="M108 140v120M138 140v120M168 140v120M198 140v120"/></g>
  <text x="150" y="310" class="label">image x</text><text x="150" y="341" class="small">H × W × 3 tensor</text>

  <line x1="245" y1="200" x2="330" y2="200" class="arrow"/>

  <rect x="330" y="125" width="190" height="150" rx="16" class="box" fill="#31688e"/>
  <text x="425" y="185" class="label-inv">flatten</text>
  <text x="425" y="225" class="small-inv">x ∈ ℝ<tspan dy="-7" font-size="13">D</tspan></text>
  <text x="425" y="310" class="label">representation</text>

  <line x1="520" y1="200" x2="605" y2="200" class="arrow"/>

  <rect x="605" y="125" width="205" height="150" rx="16" class="box" fill="#35b779"/>
  <text x="707" y="180" class="label">Wx + b</text><text x="707" y="222" class="small">parameters</text><text x="707" y="310" class="label">model f(x)</text>

  <line x1="810" y1="200" x2="895" y2="200" class="arrow"/>

  <rect x="895" y="125" width="250" height="150" rx="16" class="box" fill="#fde725"/>
  <text x="1020" y="180" class="label">scores s</text><text x="1020" y="222" class="small">one per class</text><text x="1020" y="310" class="label">prediction</text>

  <path d="M1120 275 V380 H630 V275" class="arrow"/>
  <text x="875" y="410" class="caption">compare with label y using a loss L(s, y)</text>
</svg>
