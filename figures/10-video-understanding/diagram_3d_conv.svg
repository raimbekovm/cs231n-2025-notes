  <title id="conv3dTitle">Temporal extent of an early-fusion filter against a 3D filter</title>
  <desc id="conv3dDesc">Two panels. In each the input clip is drawn as eight frame columns running left to right in time. On the left the early-fusion filter spans all eight columns and its output is a single block with no temporal axis. On the right the 3D filter spans three columns and is shown again in a shifted position, with an arrow indicating that it slides over time; its output retains all eight columns.</desc>
