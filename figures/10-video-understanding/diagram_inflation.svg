<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 356" width="820" height="356"
     role="img" aria-labelledby="inflationTitle inflationDesc" font-family="Source Serif 4, Georgia, serif">
  <title id="inflationTitle">Why the one-over-Kt scaling makes inflation exact</title>
  <desc id="inflationDesc">Two rows. The top row shows a trained 2D kernel applied to a still image, producing an H by W output. The bottom row shows the same frame repeated four times, a kernel copied four times along the new temporal axis with each copy divided by four, and an output of one by H by W. A dashed line marks the two outputs as identical.</desc>
  <text x="40.0" y="40.0" font-size="13" fill="currentColor" text-anchor="start" font-weight="600">trained 2D layer</text>
  <rect x="40.0" y="74.0" width="62.0" height="62.0" fill="#3b528b" fill-opacity="0.2" stroke="#1b1b1b" stroke-width="0.7" stroke-opacity="0.4"/>
  <text x="71.0" y="152.0" font-size="10.5" fill="currentColor" text-anchor="middle" fill-opacity="0.8">image 3×H×W</text>
  <rect x="300.0" y="88.0" width="40.0" height="34.0" fill="#21918c" fill-opacity="0.35" stroke="#1b1b1b" stroke-width="0.7" stroke-opacity="0.4"/>
  <text x="320.0" y="136.0" font-size="10.5" fill="currentColor" text-anchor="middle" fill-opacity="0.8">kernel W</text>
  <line x1="108.0" y1="105.0" x2="288.0" y2="105.0" stroke="currentColor" stroke-width="1.1" stroke-opacity="0.5"/>
  <polygon points="294.0,105.0 288.0,107.7 288.0,102.3" fill="currentColor" fill-opacity="0.5" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <rect x="596.0" y="74.0" width="56.0" height="62.0" fill="#440154" fill-opacity="0.2" stroke="#1b1b1b" stroke-width="0.7" stroke-opacity="0.4"/>
  <text x="624.0" y="64.0" font-size="10.5" fill="currentColor" text-anchor="middle" fill-opacity="0.8">output H×W</text>
  <line x1="346.0" y1="105.0" x2="584.0" y2="105.0" stroke="currentColor" stroke-width="1.1" stroke-opacity="0.5"/>
  <polygon points="590.0,105.0 584.0,107.7 584.0,102.3" fill="currentColor" fill-opacity="0.5" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <rect x="40.0" y="216.0" width="62.0" height="62.0" fill="#3b528b" fill-opacity="0.2" stroke="#1b1b1b" stroke-width="0.7" stroke-opacity="0.4"/>
  <rect x="49.0" y="209.0" width="62.0" height="62.0" fill="#3b528b" fill-opacity="0.12" stroke="#1b1b1b" stroke-width="0.7" stroke-opacity="0.4"/>
  <rect x="58.0" y="202.0" width="62.0" height="62.0" fill="#3b528b" fill-opacity="0.12" stroke="#1b1b1b" stroke-width="0.7" stroke-opacity="0.4"/>
  <rect x="67.0" y="195.0" width="62.0" height="62.0" fill="#3b528b" fill-opacity="0.12" stroke="#1b1b1b" stroke-width="0.7" stroke-opacity="0.4"/>
  <text x="85.0" y="294.0" font-size="10.5" fill="currentColor" text-anchor="middle" fill-opacity="0.8">same frame ×4</text>
  <rect x="300.0" y="230.0" width="40.0" height="34.0" fill="#21918c" fill-opacity="0.35" stroke="#1b1b1b" stroke-width="0.7" stroke-opacity="0.4"/>
  <text x="320.0" y="252.0" font-size="8.5" fill="currentColor" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" fill-opacity="0.85">W/4</text>
  <rect x="322.0" y="224.0" width="40.0" height="34.0" fill="#21918c" fill-opacity="0.35" stroke="#1b1b1b" stroke-width="0.7" stroke-opacity="0.4"/>
  <text x="342.0" y="246.0" font-size="8.5" fill="currentColor" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" fill-opacity="0.85">W/4</text>
  <rect x="344.0" y="218.0" width="40.0" height="34.0" fill="#21918c" fill-opacity="0.35" stroke="#1b1b1b" stroke-width="0.7" stroke-opacity="0.4"/>
  <text x="364.0" y="240.0" font-size="8.5" fill="currentColor" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" fill-opacity="0.85">W/4</text>
  <rect x="366.0" y="212.0" width="40.0" height="34.0" fill="#21918c" fill-opacity="0.35" stroke="#1b1b1b" stroke-width="0.7" stroke-opacity="0.4"/>
  <text x="386.0" y="234.0" font-size="8.5" fill="currentColor" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" fill-opacity="0.85">W/4</text>
  <text x="353.0" y="290.0" font-size="10.5" fill="currentColor" text-anchor="middle" fill-opacity="0.8">kernel copied 4×, each divided by 4</text>
  <line x1="108.0" y1="247.0" x2="288.0" y2="247.0" stroke="currentColor" stroke-width="1.1" stroke-opacity="0.5"/>
  <polygon points="294.0,247.0 288.0,249.7 288.0,244.3" fill="currentColor" fill-opacity="0.5" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <rect x="596.0" y="216.0" width="56.0" height="62.0" fill="#440154" fill-opacity="0.2" stroke="#1b1b1b" stroke-width="0.7" stroke-opacity="0.4"/>
  <text x="624.0" y="294.0" font-size="10.5" fill="currentColor" text-anchor="middle" fill-opacity="0.8">output 1×H×W</text>
  <line x1="412.0" y1="247.0" x2="584.0" y2="247.0" stroke="currentColor" stroke-width="1.1" stroke-opacity="0.5"/>
  <polygon points="590.0,247.0 584.0,249.7 584.0,244.3" fill="currentColor" fill-opacity="0.5" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <text x="40.0" y="178.0" font-size="13" fill="currentColor" text-anchor="start" font-weight="600">inflated 3D layer</text>
  <line x1="624.0" y1="140.0" x2="624.0" y2="212.0" stroke="currentColor" stroke-width="1.2" stroke-opacity="0.45" stroke-dasharray="5 4"/>
  <text x="642.0" y="181.0" font-size="12" fill="currentColor" text-anchor="start" font-style="italic" fill-opacity="0.8">identical</text>
  <text x="410.0" y="344.0" font-size="10.5" fill="currentColor" text-anchor="middle" font-style="italic" fill-opacity="0.65">so the inflated network starts out reproducing the 2D network it was built from</text>
</svg>
