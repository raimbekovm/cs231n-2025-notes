<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" width="660" height="300"
     role="img" aria-labelledby="sports1mTitle sports1mDesc" font-family="Source Serif 4, Georgia, serif">
  <title id="sports1mTitle">Top-5 accuracy on Sports-1M by fusion strategy</title>
  <desc id="sports1mDesc">A bar chart of five video-level top-5 accuracies on Sports-1M: single frame 77.7, early fusion 76.8, late fusion 78.7, 3D CNN 80.2, C3D 84.4.</desc>
  <line x1="46.0" y1="254.0" x2="644.0" y2="254.0" stroke="currentColor" stroke-width="1.0" stroke-opacity="0.16"/>
  <text x="41.0" y="258.0" font-size="11" fill="currentColor" text-anchor="end" fill-opacity="0.7">70</text>
  <line x1="46.0" y1="199.0" x2="644.0" y2="199.0" stroke="currentColor" stroke-width="1.0" stroke-opacity="0.16"/>
  <text x="41.0" y="203.0" font-size="11" fill="currentColor" text-anchor="end" fill-opacity="0.7">74</text>
  <line x1="46.0" y1="144.0" x2="644.0" y2="144.0" stroke="currentColor" stroke-width="1.0" stroke-opacity="0.16"/>
  <text x="41.0" y="148.0" font-size="11" fill="currentColor" text-anchor="end" fill-opacity="0.7">78</text>
  <line x1="46.0" y1="89.0" x2="644.0" y2="89.0" stroke="currentColor" stroke-width="1.0" stroke-opacity="0.16"/>
  <text x="41.0" y="93.0" font-size="11" fill="currentColor" text-anchor="end" fill-opacity="0.7">82</text>
  <line x1="46.0" y1="34.0" x2="644.0" y2="34.0" stroke="currentColor" stroke-width="1.0" stroke-opacity="0.16"/>
  <text x="41.0" y="38.0" font-size="11" fill="currentColor" text-anchor="end" fill-opacity="0.7">86</text>
  <text transform="rotate(-90 16 144.0)" x="16.0" y="144.0" font-size="11" fill="currentColor" text-anchor="middle" font-style="italic" fill-opacity="0.7">top-5 accuracy (%)</text>
  <rect x="82.2" y="148.1" width="58.0" height="105.9" fill="#3b528b" fill-opacity="0.75" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <text x="111.2" y="141.1" font-size="12" fill="currentColor" text-anchor="middle" font-weight="600">77.7</text>
  <text x="111.2" y="270.0" font-size="10.5" fill="currentColor" text-anchor="middle" fill-opacity="0.85">Single</text>
  <text x="111.2" y="282.0" font-size="10.5" fill="currentColor" text-anchor="middle" fill-opacity="0.85">frame</text>
  <rect x="200.6" y="160.5" width="58.0" height="93.5" fill="#5ec962" fill-opacity="0.75" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <text x="229.6" y="153.5" font-size="12" fill="currentColor" text-anchor="middle" font-weight="600">76.8</text>
  <text x="229.6" y="270.0" font-size="10.5" fill="currentColor" text-anchor="middle" fill-opacity="0.85">Early</text>
  <text x="229.6" y="282.0" font-size="10.5" fill="currentColor" text-anchor="middle" fill-opacity="0.85">fusion</text>
  <rect x="319.0" y="134.4" width="58.0" height="119.6" fill="#5ec962" fill-opacity="0.75" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <text x="348.0" y="127.4" font-size="12" fill="currentColor" text-anchor="middle" font-weight="600">78.7</text>
  <text x="348.0" y="270.0" font-size="10.5" fill="currentColor" text-anchor="middle" fill-opacity="0.85">Late</text>
  <text x="348.0" y="282.0" font-size="10.5" fill="currentColor" text-anchor="middle" fill-opacity="0.85">fusion</text>
  <rect x="437.4" y="113.7" width="58.0" height="140.3" fill="#21918c" fill-opacity="0.75" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <text x="466.4" y="106.7" font-size="12" fill="currentColor" text-anchor="middle" font-weight="600">80.2</text>
  <text x="466.4" y="270.0" font-size="10.5" fill="currentColor" text-anchor="middle" fill-opacity="0.85">3D CNN</text>
  <text x="466.4" y="282.0" font-size="10.5" fill="currentColor" text-anchor="middle" fill-opacity="0.85">(slow fusion)</text>
  <rect x="555.8" y="56.0" width="58.0" height="198.0" fill="#440154" fill-opacity="0.75" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <text x="584.8" y="49.0" font-size="12" fill="currentColor" text-anchor="middle" font-weight="600">84.4</text>
  <text x="584.8" y="270.0" font-size="10.5" fill="currentColor" text-anchor="middle" fill-opacity="0.85">C3D</text>
  <text x="584.8" y="282.0" font-size="10.5" fill="currentColor" text-anchor="middle" fill-opacity="0.85">(2015)</text>
  <line x1="46.0" y1="254.0" x2="644.0" y2="254.0" stroke="currentColor" stroke-width="1.0" stroke-opacity="0.5"/>
  <text x="330.0" y="20.0" font-size="13" fill="currentColor" text-anchor="middle" font-weight="600">Sports-1M, video-level top-5 accuracy</text>
</svg>
