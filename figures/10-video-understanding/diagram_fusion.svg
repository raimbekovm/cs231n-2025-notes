<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 268" width="880" height="268"
     role="img" aria-labelledby="fusionTitle fusionDesc" font-family="Source Serif 4, Georgia, serif">
  <title id="fusionTitle">Where four video architectures consume the temporal axis</title>
  <desc id="fusionDesc">Four panels, each a left-to-right chain of blocks. The vertical height of a block is divided into as many slabs as there are frames still represented at that stage. The single-frame CNN keeps five slabs all the way to the class scores and averages probabilities. Late fusion keeps five through the 2D CNN and collapses to one at a pooling or MLP layer. Early fusion collapses to one at the first convolution. The 3D CNN goes from five to three to one across successive layers.</desc>
