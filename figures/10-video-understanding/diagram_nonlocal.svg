  <text x="65.0" y="180.0" font-size="9.5" fill="currentColor" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" fill-opacity="0.7">C×T×H×W</text>
  <rect x="132.0" y="54.0" width="96.0" height="44.0" fill="#3b528b" fill-opacity="0.16" stroke="#3b528b" stroke-width="1.1" stroke-opacity="0.8" rx="5"/>
  <text x="180.0" y="71.0" font-size="11" fill="currentColor" text-anchor="middle" font-weight="600">queries</text>
