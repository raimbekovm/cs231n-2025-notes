  <text x="180.0" y="143.0" font-size="11" fill="currentColor" text-anchor="middle" font-weight="600">keys</text>
  <text x="180.0" y="160.0" font-size="9.5" fill="currentColor" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" fill-opacity="0.7">1×1×1 conv</text>
