<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300"
     role="img" aria-labelledby="nonlocalTitle nonlocalDesc" font-family="Source Serif 4, Georgia, serif">
  <title id="nonlocalTitle">The wiring of a non-local block</title>
  <desc id="nonlocalDesc">A left-to-right diagram. The input feature map feeds three parallel one-by-one-by-one convolutions producing queries, keys and values. Queries and keys form a THW by THW affinity matrix, softmaxed over positions; this weights a sum of the values. A final one-by-one-by-one convolution restores the channel count and its output is added to the input through a residual connection drawn above the block.</desc>
