  <title id="overfitTitle">A wiggly fit and a straight fit to the same nine points</title>
  <desc id="overfitDesc">Nine noisy observations of a linear relationship. A degree-eight polynomial passes exactly through every point and oscillates between them; a straight line misses all nine but follows the underlying trend.</desc>
