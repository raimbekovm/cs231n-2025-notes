  <title id="sgdProbTitle">Two obstacles for gradient descent</title>
  <desc id="sgdProbDesc">Left: elongated elliptical level sets, with a descent path that oscillates across the narrow valley while advancing slowly along it. Right: the two principal cross-sections through a saddle point, one curving upwards and one downwards, both flat at the centre.</desc>
