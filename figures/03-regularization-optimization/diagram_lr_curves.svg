  <title id="lrCurvesTitle">Training loss under four learning rates</title>
  <desc id="lrCurvesDesc">Stochastic gradient descent on the same quadratic objective at four step sizes, with loss on a logarithmic axis. The largest diverges off the top; the smallest descends slowly and never arrives; an intermediate one falls fastest at first and then flattens an order of magnitude above where it could have gone; a well-chosen one falls quickly and keeps improving.</desc>
