  <text x="92.0" y="320.0" font-size="10.5" fill="currentColor" text-anchor="middle" fill-opacity="0.62">1</text>
  <line x1="356.2" y1="52.0" x2="356.2" y2="300.0" stroke="currentColor" stroke-width="1.0" stroke-opacity="0.14" stroke-dasharray="2 4"/>
  <text x="356.2" y="320.0" font-size="10.5" fill="currentColor" text-anchor="middle" fill-opacity="0.62">10</text>
  <line x1="620.5" y1="52.0" x2="620.5" y2="300.0" stroke="currentColor" stroke-width="1.0" stroke-opacity="0.14" stroke-dasharray="2 4"/>
  <text x="620.5" y="320.0" font-size="10.5" fill="currentColor" text-anchor="middle" fill-opacity="0.62">100</text>
  <line x1="92.0" y1="300.0" x2="700.0" y2="300.0" stroke="currentColor" stroke-width="1.0" stroke-opacity="0.14" stroke-dasharray="2 4"/>
  <text x="82.0" y="304.0" font-size="10.5" fill="currentColor" text-anchor="end" fill-opacity="0.62">200</text>
  <line x1="92.0" y1="202.5" x2="700.0" y2="202.5" stroke="currentColor" stroke-width="1.0" stroke-opacity="0.14" stroke-dasharray="2 4"/>
  <text x="82.0" y="206.5" font-size="10.5" fill="currentColor" text-anchor="end" fill-opacity="0.62">1,000</text>
  <line x1="92.0" y1="63.0" x2="700.0" y2="63.0" stroke="currentColor" stroke-width="1.0" stroke-opacity="0.14" stroke-dasharray="2 4"/>
  <text x="82.0" y="67.0" font-size="10.5" fill="currentColor" text-anchor="end" fill-opacity="0.62">10,000</text>
