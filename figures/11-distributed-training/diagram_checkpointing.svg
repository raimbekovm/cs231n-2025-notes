<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380"
     role="img" aria-labelledby="ckptTitle ckptDesc" font-family="Source Serif 4, Georgia, serif">
  <title id="ckptTitle">The compute-memory trade-off of activation checkpointing</title>
  <desc id="ckptDesc">A log-log plot with peak activation memory on the horizontal axis and compute on the vertical. A curve traces the family of naive checkpointing schemes for a 126-layer network, running from recompute-everything at the top left through the square-root-N point to store-everything at the bottom right. A separate marked point below the curve is the segment-recompute scheme, which reaches square-root memory at three times the compute.</desc>
