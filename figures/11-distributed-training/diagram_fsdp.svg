  <text x="388.0" y="260.0" font-size="11" fill="#3b528b" text-anchor="middle">three consecutive layers, three resources, one instant</text>
  <text x="20.0" y="288.0" font-size="11" fill="currentColor" text-anchor="start" fill-opacity="0.7">The gather runs one layer ahead of the arithmetic and the reduction one layer behind it.</text>
