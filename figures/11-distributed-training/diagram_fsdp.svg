  <rect x="347.0" y="70.0" width="82.0" height="44.0" fill="#3b528b" fill-opacity="0.32" stroke="#3b528b" stroke-width="1.2" stroke-opacity="1.0" rx="3"/>
  <text x="388.0" y="96.5" font-size="12" fill="currentColor" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace">L5</text>
