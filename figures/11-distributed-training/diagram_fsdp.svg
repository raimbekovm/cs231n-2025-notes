  <text x="388.0" y="212.5" font-size="12" fill="currentColor" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace">L3</text>
  <rect x="435.0" y="186.0" width="82.0" height="44.0" fill="#440154" fill-opacity="0.32" stroke="#440154" stroke-width="1.2" stroke-opacity="1.0" rx="3"/>
  <text x="476.0" y="212.5" font-size="12" fill="currentColor" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace">L2</text>
