<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" width="780" height="300"
     role="img" aria-labelledby="memhierTitle memhierDesc" font-family="Source Serif 4, Georgia, serif">
  <title id="memhierTitle">Bandwidth at four levels of a GPU cluster's memory hierarchy</title>
  <desc id="memhierDesc">Horizontal bars on a logarithmic axis. Within one GPU, 3352 gigabytes per second reaching 80 gigabytes. Within one server of eight GPUs over NVLink, 900 gigabytes per second reaching 640 gigabytes. Within one pod of 3072 GPUs, 50 gigabytes per second reaching 246 terabytes. Across the eight pods of the full cluster, about 7 gigabytes per second reaching 1.9 petabytes. Each step outward multiplies capacity and divides speed.</desc>
  <text x="20.0" y="26.0" font-size="13.5" fill="currentColor" text-anchor="start" font-weight="600">Bandwidth between the two ends of each level</text>
  <line x1="200.0" y1="52.0" x2="200.0" y2="236.0" stroke="currentColor" stroke-width="1.0" stroke-opacity="0.16" stroke-dasharray="2 4"/>
  <text x="200.0" y="258.0" font-size="10.5" fill="currentColor" text-anchor="middle" fill-opacity="0.6">1</text>
  <line x1="300.0" y1="52.0" x2="300.0" y2="236.0" stroke="currentColor" stroke-width="1.0" stroke-opacity="0.16" stroke-dasharray="2 4"/>
  <text x="300.0" y="258.0" font-size="10.5" fill="currentColor" text-anchor="middle" fill-opacity="0.6">10</text>
  <line x1="400.0" y1="52.0" x2="400.0" y2="236.0" stroke="currentColor" stroke-width="1.0" stroke-opacity="0.16" stroke-dasharray="2 4"/>
  <text x="400.0" y="258.0" font-size="10.5" fill="currentColor" text-anchor="middle" fill-opacity="0.6">100</text>
  <line x1="500.0" y1="52.0" x2="500.0" y2="236.0" stroke="currentColor" stroke-width="1.0" stroke-opacity="0.16" stroke-dasharray="2 4"/>
  <text x="500.0" y="258.0" font-size="10.5" fill="currentColor" text-anchor="middle" fill-opacity="0.6">1,000</text>
  <line x1="600.0" y1="52.0" x2="600.0" y2="236.0" stroke="currentColor" stroke-width="1.0" stroke-opacity="0.16" stroke-dasharray="2 4"/>
  <text x="600.0" y="258.0" font-size="10.5" fill="currentColor" text-anchor="middle" fill-opacity="0.6">10,000</text>
  <text x="400.0" y="278.0" font-size="11.5" fill="currentColor" text-anchor="middle" fill-opacity="0.7">GB / sec  (log scale)</text>
  <text x="190.0" y="74.0" font-size="12.5" fill="currentColor" text-anchor="end">Within one GPU</text>
  <text x="190.0" y="88.0" font-size="10" fill="currentColor" text-anchor="end" fill-opacity="0.62">HBM to compute cores</text>
  <rect x="200.0" y="62.0" width="352.5" height="22.0" fill="#21918c" fill-opacity="0.42" stroke="#21918c" stroke-width="1.1" stroke-opacity="1.0" rx="2"/>
  <text x="560.5" y="78.0" font-size="11.5" fill="currentColor" text-anchor="start" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace">3,352</text>
  <text x="764.0" y="78.0" font-size="11.5" fill="currentColor" text-anchor="end" fill-opacity="0.72">80 GB</text>
  <text x="190.0" y="118.0" font-size="12.5" fill="currentColor" text-anchor="end">Within one server</text>
  <text x="190.0" y="132.0" font-size="10" fill="currentColor" text-anchor="end" fill-opacity="0.62">NVLink, 8 GPUs</text>
  <rect x="200.0" y="106.0" width="295.4" height="22.0" fill="#5ec962" fill-opacity="0.42" stroke="#5ec962" stroke-width="1.1" stroke-opacity="1.0" rx="2"/>
  <text x="503.4" y="122.0" font-size="11.5" fill="currentColor" text-anchor="start" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace">900</text>
  <text x="764.0" y="122.0" font-size="11.5" fill="currentColor" text-anchor="end" fill-opacity="0.72">640 GB</text>
  <text x="190.0" y="162.0" font-size="12.5" fill="currentColor" text-anchor="end">Within one pod</text>
  <text x="190.0" y="176.0" font-size="10" fill="currentColor" text-anchor="end" fill-opacity="0.62">192 racks, 3,072 GPUs</text>
  <rect x="200.0" y="150.0" width="169.9" height="22.0" fill="#3b528b" fill-opacity="0.42" stroke="#3b528b" stroke-width="1.1" stroke-opacity="1.0" rx="2"/>
  <text x="377.9" y="166.0" font-size="11.5" fill="currentColor" text-anchor="start" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace">50</text>
  <text x="764.0" y="166.0" font-size="11.5" fill="currentColor" text-anchor="end" fill-opacity="0.72">246 TB</text>
  <text x="190.0" y="206.0" font-size="12.5" fill="currentColor" text-anchor="end">Across pods</text>
  <text x="190.0" y="220.0" font-size="10" fill="currentColor" text-anchor="end" fill-opacity="0.62">8 pods, 24,576 GPUs</text>
  <rect x="200.0" y="194.0" width="85.4" height="22.0" fill="#440154" fill-opacity="0.42" stroke="#440154" stroke-width="1.1" stroke-opacity="1.0" rx="2"/>
  <text x="293.4" y="210.0" font-size="11.5" fill="currentColor" text-anchor="start" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace">≈7</text>
  <text x="764.0" y="210.0" font-size="11.5" fill="currentColor" text-anchor="end" fill-opacity="0.72">1.9 PB</text>
  <text x="764.0" y="40.0" font-size="10.5" fill="currentColor" text-anchor="end" fill-opacity="0.6">memory reachable</text>
</svg>
