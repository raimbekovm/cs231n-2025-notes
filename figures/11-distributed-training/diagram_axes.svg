<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 330" width="840" height="330"
     role="img" aria-labelledby="axesTitle axesDesc" font-family="Source Serif 4, Georgia, serif">
  <title id="axesTitle">The four axes of a transformer's computation</title>
  <desc id="axesDesc">At left a stack of seven layers with a dashed cut between them labelled pipeline parallelism splits L. At right the activation tensor drawn as a cuboid with three dashed cutting planes: along the feature dimension D for tensor parallelism, along the sequence dimension S for context parallelism, and across the batch depth B for data parallelism.</desc>
  <text x="20.0" y="28.0" font-size="12.5" fill="currentColor" text-anchor="start" fill-opacity="0.75">A stack of L layers</text>
  <rect x="46.0" y="250.0" width="130.0" height="20.0" fill="#1b1b1b" fill-opacity="0.08" stroke="#1b1b1b" stroke-width="1.1" stroke-opacity="1.0" rx="3"/>
  <text x="111.0" y="264.5" font-size="10.5" fill="currentColor" text-anchor="middle" fill-opacity="0.8">layer 7</text>
  <rect x="46.0" y="220.0" width="130.0" height="20.0" fill="#1b1b1b" fill-opacity="0.08" stroke="#1b1b1b" stroke-width="1.1" stroke-opacity="1.0" rx="3"/>
  <text x="111.0" y="234.5" font-size="10.5" fill="currentColor" text-anchor="middle" fill-opacity="0.8">layer 6</text>
  <rect x="46.0" y="190.0" width="130.0" height="20.0" fill="#1b1b1b" fill-opacity="0.08" stroke="#1b1b1b" stroke-width="1.1" stroke-opacity="1.0" rx="3"/>
  <text x="111.0" y="204.5" font-size="10.5" fill="currentColor" text-anchor="middle" fill-opacity="0.8">layer 5</text>
  <rect x="46.0" y="160.0" width="130.0" height="20.0" fill="#1b1b1b" fill-opacity="0.08" stroke="#1b1b1b" stroke-width="1.1" stroke-opacity="1.0" rx="3"/>
  <text x="111.0" y="174.5" font-size="10.5" fill="currentColor" text-anchor="middle" fill-opacity="0.8">layer 4</text>
  <rect x="46.0" y="130.0" width="130.0" height="20.0" fill="#1b1b1b" fill-opacity="0.08" stroke="#1b1b1b" stroke-width="1.1" stroke-opacity="1.0" rx="3"/>
  <text x="111.0" y="144.5" font-size="10.5" fill="currentColor" text-anchor="middle" fill-opacity="0.8">layer 3</text>
  <rect x="46.0" y="100.0" width="130.0" height="20.0" fill="#1b1b1b" fill-opacity="0.08" stroke="#1b1b1b" stroke-width="1.1" stroke-opacity="1.0" rx="3"/>
  <text x="111.0" y="114.5" font-size="10.5" fill="currentColor" text-anchor="middle" fill-opacity="0.8">layer 2</text>
  <rect x="46.0" y="70.0" width="130.0" height="20.0" fill="#1b1b1b" fill-opacity="0.08" stroke="#1b1b1b" stroke-width="1.1" stroke-opacity="1.0" rx="3"/>
  <text x="111.0" y="84.5" font-size="10.5" fill="currentColor" text-anchor="middle" fill-opacity="0.8">layer 1</text>
  <line x1="28.0" y1="155.0" x2="194.0" y2="155.0" stroke="#440154" stroke-width="1.6" stroke-opacity="1.0" stroke-dasharray="5 4"/>
  <text x="202.0" y="159.0" font-size="11.5" fill="#440154" text-anchor="start" font-weight="600">PP — split L</text>
  <line x1="202.0" y1="212.0" x2="364.0" y2="212.0" stroke="currentColor" stroke-width="1.3" stroke-opacity="0.6"/>
  <polygon points="370.0,212.0 364.0,214.7 364.0,209.3" fill="currentColor" fill-opacity="0.6" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <text x="286.0" y="202.0" font-size="10.5" fill="currentColor" text-anchor="middle" fill-opacity="0.7">each layer acts on</text>
  <rect x="380.0" y="96.0" width="268.0" height="168.0" fill="#1b1b1b" fill-opacity="0.09" stroke="#1b1b1b" stroke-width="1.2" stroke-opacity="1.0"/>
  <polygon points="380.0,96.0 434.0,50.0 702.0,50.0 648.0,96.0" fill="#1b1b1b" fill-opacity="0.054" stroke="#1b1b1b" stroke-width="1.2"/>
  <polygon points="648.0,96.0 702.0,50.0 702.0,218.0 648.0,264.0" fill="#1b1b1b" fill-opacity="0.027" stroke="#1b1b1b" stroke-width="1.2"/>
  <line x1="514.0" y1="96.0" x2="568.0" y2="50.0" stroke="#21918c" stroke-width="1.6" stroke-opacity="1.0" stroke-dasharray="5 4"/>
  <line x1="514.0" y1="96.0" x2="514.0" y2="264.0" stroke="#21918c" stroke-width="1.6" stroke-opacity="1.0" stroke-dasharray="5 4"/>
  <text x="514.0" y="286.0" font-size="11" fill="currentColor" text-anchor="middle" fill-opacity="0.75">D — feature</text>
  <text x="518.0" y="304.0" font-size="11.5" fill="#21918c" text-anchor="middle" font-weight="600">TP — split D</text>
  <line x1="380.0" y1="180.0" x2="648.0" y2="180.0" stroke="#5ec962" stroke-width="1.6" stroke-opacity="1.0" stroke-dasharray="5 4"/>
  <line x1="648.0" y1="180.0" x2="702.0" y2="134.0" stroke="#5ec962" stroke-width="1.6" stroke-opacity="1.0" stroke-dasharray="5 4"/>
  <text x="368.0" y="140.0" font-size="11" fill="currentColor" text-anchor="end" fill-opacity="0.75">S — sequence</text>
  <text x="368.0" y="156.0" font-size="11.5" fill="#5ec962" text-anchor="end" font-weight="600">CP — split S</text>
  <line x1="675.0" y1="73.0" x2="675.0" y2="241.0" stroke="#3b528b" stroke-width="1.6" stroke-opacity="1.0" stroke-dasharray="5 4"/>
  <text x="699.0" y="24.0" font-size="11" fill="currentColor" text-anchor="start" fill-opacity="0.75">B — batch</text>
  <text x="699.0" y="40.0" font-size="11.5" fill="#3b528b" text-anchor="start" font-weight="600">DP — split B</text>
  <text x="20.0" y="316.0" font-size="11" fill="currentColor" text-anchor="start" fill-opacity="0.7">Four indices, four ways to cut them across devices.</text>
</svg>
