  <title id="ppTitle">A four-stage GPipe pipeline with four microbatches</title>
  <desc id="ppDesc">A grid of four GPU rows against fourteen time slots. Coloured cells mark forward and backward work on each of four microbatches, arranged as a descending diagonal during the forward sweep and an ascending one during the backward sweep. The pale cells at the start and end are the bubble; 32 of the 56 cells are busy, a utilisation of 57.1 percent.</desc>
