<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" width="840" height="400"
     role="img" aria-labelledby="tpTitle tpDesc" font-family="Source Serif 4, Georgia, serif">
  <title id="tpTitle">Column-parallel and row-parallel block matrix multiplication</title>
  <desc id="tpDesc">The top row shows X times W equals Y, with W cut into four column blocks in four colours and Y inheriting the same four column blocks, requiring no communication. The bottom row shows those Y blocks multiplied by U cut into four row blocks of matching colour, producing four full-sized partial sums that are combined by a single all-reduce into Z.</desc>
  <text x="20.0" y="34.0" font-size="12" fill="currentColor" text-anchor="start" font-weight="600">layer 1 — split W into column blocks</text>
  <rect x="58.0" y="56.0" width="62.0" height="84.0" fill="#1b1b1b" fill-opacity="0.09" stroke="#1b1b1b" stroke-width="1.3" stroke-opacity="1.0"/>
  <text x="89.0" y="103.0" font-size="13" fill="currentColor" text-anchor="middle">X</text>
  <text x="89.0" y="157.0" font-size="10" fill="currentColor" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" fill-opacity="0.68">N × D</text>
  <text x="134.0" y="104.0" font-size="16" fill="currentColor" text-anchor="middle" fill-opacity="0.7">×</text>
  <rect x="150.0" y="56.0" width="52.0" height="84.0" fill="#440154" fill-opacity="0.4" stroke="#440154" stroke-width="1.2" stroke-opacity="1.0"/>
  <text x="176.0" y="102.5" font-size="12" fill="currentColor" text-anchor="middle">W<tspan font-size='9' dy='3'>1</tspan></text>
  <rect x="202.0" y="56.0" width="52.0" height="84.0" fill="#3b528b" fill-opacity="0.4" stroke="#3b528b" stroke-width="1.2" stroke-opacity="1.0"/>
  <text x="228.0" y="102.5" font-size="12" fill="currentColor" text-anchor="middle">W<tspan font-size='9' dy='3'>2</tspan></text>
  <rect x="254.0" y="56.0" width="52.0" height="84.0" fill="#21918c" fill-opacity="0.4" stroke="#21918c" stroke-width="1.2" stroke-opacity="1.0"/>
  <text x="280.0" y="102.5" font-size="12" fill="currentColor" text-anchor="middle">W<tspan font-size='9' dy='3'>3</tspan></text>
  <rect x="306.0" y="56.0" width="52.0" height="84.0" fill="#5ec962" fill-opacity="0.4" stroke="#5ec962" stroke-width="1.2" stroke-opacity="1.0"/>
  <text x="332.0" y="102.5" font-size="12" fill="currentColor" text-anchor="middle">W<tspan font-size='9' dy='3'>4</tspan></text>
  <rect x="150.0" y="56.0" width="208.0" height="84.0" fill="none" fill-opacity="1.0" stroke="#1b1b1b" stroke-width="1.3" stroke-opacity="1.0"/>
  <text x="254.0" y="157.0" font-size="10" fill="currentColor" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" fill-opacity="0.68">D × D</text>
  <text x="374.0" y="104.0" font-size="16" fill="currentColor" text-anchor="middle" fill-opacity="0.7">=</text>
  <rect x="392.0" y="56.0" width="52.0" height="84.0" fill="#440154" fill-opacity="0.4" stroke="#440154" stroke-width="1.2" stroke-opacity="1.0"/>
  <text x="418.0" y="102.5" font-size="12" fill="currentColor" text-anchor="middle">Y<tspan font-size='9' dy='3'>1</tspan></text>
  <rect x="444.0" y="56.0" width="52.0" height="84.0" fill="#3b528b" fill-opacity="0.4" stroke="#3b528b" stroke-width="1.2" stroke-opacity="1.0"/>
  <text x="470.0" y="102.5" font-size="12" fill="currentColor" text-anchor="middle">Y<tspan font-size='9' dy='3'>2</tspan></text>
  <rect x="496.0" y="56.0" width="52.0" height="84.0" fill="#21918c" fill-opacity="0.4" stroke="#21918c" stroke-width="1.2" stroke-opacity="1.0"/>
  <text x="522.0" y="102.5" font-size="12" fill="currentColor" text-anchor="middle">Y<tspan font-size='9' dy='3'>3</tspan></text>
  <rect x="548.0" y="56.0" width="52.0" height="84.0" fill="#5ec962" fill-opacity="0.4" stroke="#5ec962" stroke-width="1.2" stroke-opacity="1.0"/>
  <text x="574.0" y="102.5" font-size="12" fill="currentColor" text-anchor="middle">Y<tspan font-size='9' dy='3'>4</tspan></text>
  <rect x="392.0" y="56.0" width="208.0" height="84.0" fill="none" fill-opacity="1.0" stroke="#1b1b1b" stroke-width="1.3" stroke-opacity="1.0"/>
  <text x="496.0" y="157.0" font-size="10" fill="currentColor" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" fill-opacity="0.68">N × D</text>
  <text x="628.0" y="90.0" font-size="11" fill="currentColor" text-anchor="start" fill-opacity="0.8">each GPU already holds X,</text>
  <text x="628.0" y="106.0" font-size="11" fill="currentColor" text-anchor="start" fill-opacity="0.8">so it computes X W</text>
  <text x="628.0" y="122.0" font-size="11" fill="#21918c" text-anchor="start" font-weight="600">with no communication.</text>
  <text x="20.0" y="206.0" font-size="12" fill="currentColor" text-anchor="start" font-weight="600">layer 2 — split U into row blocks</text>
  <rect x="58.0" y="228.0" width="42.0" height="84.0" fill="#440154" fill-opacity="0.18" stroke="#440154" stroke-width="1.2" stroke-opacity="1.0"/>
  <text x="79.0" y="274.5" font-size="12" fill="currentColor" text-anchor="middle">Y<tspan font-size='9' dy='3'>1</tspan></text>
  <rect x="100.0" y="228.0" width="42.0" height="84.0" fill="#3b528b" fill-opacity="0.18" stroke="#3b528b" stroke-width="1.2" stroke-opacity="1.0"/>
  <text x="121.0" y="274.5" font-size="12" fill="currentColor" text-anchor="middle">Y<tspan font-size='9' dy='3'>2</tspan></text>
  <rect x="142.0" y="228.0" width="42.0" height="84.0" fill="#21918c" fill-opacity="0.18" stroke="#21918c" stroke-width="1.2" stroke-opacity="1.0"/>
  <text x="163.0" y="274.5" font-size="12" fill="currentColor" text-anchor="middle">Y<tspan font-size='9' dy='3'>3</tspan></text>
  <rect x="184.0" y="228.0" width="42.0" height="84.0" fill="#5ec962" fill-opacity="0.18" stroke="#5ec962" stroke-width="1.2" stroke-opacity="1.0"/>
  <text x="205.0" y="274.5" font-size="12" fill="currentColor" text-anchor="middle">Y<tspan font-size='9' dy='3'>4</tspan></text>
  <rect x="58.0" y="228.0" width="168.0" height="84.0" fill="none" fill-opacity="1.0" stroke="#1b1b1b" stroke-width="1.3" stroke-opacity="1.0"/>
  <text x="142.0" y="329.0" font-size="10" fill="currentColor" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" fill-opacity="0.68">N × D</text>
  <text x="240.0" y="276.0" font-size="16" fill="currentColor" text-anchor="middle" fill-opacity="0.7">×</text>
  <rect x="258.0" y="228.0" width="96.0" height="21.0" fill="#440154" fill-opacity="0.4" stroke="#440154" stroke-width="1.2" stroke-opacity="1.0"/>
  <text x="306.0" y="243.0" font-size="12" fill="currentColor" text-anchor="middle">U<tspan font-size='9' dy='3'>1</tspan></text>
  <rect x="258.0" y="249.0" width="96.0" height="21.0" fill="#3b528b" fill-opacity="0.4" stroke="#3b528b" stroke-width="1.2" stroke-opacity="1.0"/>
  <text x="306.0" y="264.0" font-size="12" fill="currentColor" text-anchor="middle">U<tspan font-size='9' dy='3'>2</tspan></text>
  <rect x="258.0" y="270.0" width="96.0" height="21.0" fill="#21918c" fill-opacity="0.4" stroke="#21918c" stroke-width="1.2" stroke-opacity="1.0"/>
  <text x="306.0" y="285.0" font-size="12" fill="currentColor" text-anchor="middle">U<tspan font-size='9' dy='3'>3</tspan></text>
  <rect x="258.0" y="291.0" width="96.0" height="21.0" fill="#5ec962" fill-opacity="0.4" stroke="#5ec962" stroke-width="1.2" stroke-opacity="1.0"/>
  <text x="306.0" y="306.0" font-size="12" fill="currentColor" text-anchor="middle">U<tspan font-size='9' dy='3'>4</tspan></text>
  <rect x="258.0" y="228.0" width="96.0" height="84.0" fill="none" fill-opacity="1.0" stroke="#1b1b1b" stroke-width="1.3" stroke-opacity="1.0"/>
  <text x="306.0" y="329.0" font-size="10" fill="currentColor" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" fill-opacity="0.68">D × D</text>
  <text x="370.0" y="276.0" font-size="16" fill="currentColor" text-anchor="middle" fill-opacity="0.7">=</text>
  <rect x="388.0" y="228.0" width="40.0" height="84.0" fill="#440154" fill-opacity="0.4" stroke="#440154" stroke-width="1.2" stroke-opacity="1.0"/>
  <text x="408.0" y="274.0" font-size="12" fill="currentColor" text-anchor="middle">Y<tspan font-size='9' dy='3'>1</tspan><tspan font-size='12' dy='-3'>U</tspan><tspan font-size='9' dy='3'>1</tspan></text>
  <rect x="434.0" y="228.0" width="40.0" height="84.0" fill="#3b528b" fill-opacity="0.4" stroke="#3b528b" stroke-width="1.2" stroke-opacity="1.0"/>
  <text x="454.0" y="274.0" font-size="12" fill="currentColor" text-anchor="middle">Y<tspan font-size='9' dy='3'>2</tspan><tspan font-size='12' dy='-3'>U</tspan><tspan font-size='9' dy='3'>2</tspan></text>
  <text x="428.0" y="276.0" font-size="13" fill="currentColor" text-anchor="middle" fill-opacity="0.7">+</text>
  <rect x="480.0" y="228.0" width="40.0" height="84.0" fill="#21918c" fill-opacity="0.4" stroke="#21918c" stroke-width="1.2" stroke-opacity="1.0"/>
  <text x="500.0" y="274.0" font-size="12" fill="currentColor" text-anchor="middle">Y<tspan font-size='9' dy='3'>3</tspan><tspan font-size='12' dy='-3'>U</tspan><tspan font-size='9' dy='3'>3</tspan></text>
  <text x="474.0" y="276.0" font-size="13" fill="currentColor" text-anchor="middle" fill-opacity="0.7">+</text>
  <rect x="526.0" y="228.0" width="40.0" height="84.0" fill="#5ec962" fill-opacity="0.4" stroke="#5ec962" stroke-width="1.2" stroke-opacity="1.0"/>
  <text x="546.0" y="274.0" font-size="12" fill="currentColor" text-anchor="middle">Y<tspan font-size='9' dy='3'>4</tspan><tspan font-size='12' dy='-3'>U</tspan><tspan font-size='9' dy='3'>4</tspan></text>
  <text x="520.0" y="276.0" font-size="13" fill="currentColor" text-anchor="middle" fill-opacity="0.7">+</text>
  <text x="468.0" y="329.0" font-size="10" fill="currentColor" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" fill-opacity="0.68">four full N × D partial sums</text>
  <line x1="584.0" y1="270.0" x2="612.0" y2="270.0" stroke="#3b528b" stroke-width="1.4" stroke-opacity="0.7"/>
  <polygon points="618.0,270.0 612.0,272.7 612.0,267.3" fill="#3b528b" fill-opacity="0.7" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <rect x="624.0" y="242.0" width="74.0" height="56.0" fill="#fde725" fill-opacity="0.28" stroke="#3b528b" stroke-width="1.4" stroke-opacity="1.0" rx="5"/>
  <text x="661.0" y="266.0" font-size="11" fill="#3b528b" text-anchor="middle">all-</text>
  <text x="661.0" y="280.0" font-size="11" fill="#3b528b" text-anchor="middle">reduce</text>
  <line x1="702.0" y1="270.0" x2="728.0" y2="270.0" stroke="#3b528b" stroke-width="1.4" stroke-opacity="0.7"/>
  <polygon points="734.0,270.0 728.0,272.7 728.0,267.3" fill="#3b528b" fill-opacity="0.7" stroke="none" stroke-width="1.0" stroke-opacity="1.0"/>
  <rect x="740.0" y="236.0" width="62.0" height="68.0" fill="#1b1b1b" fill-opacity="0.09" stroke="#1b1b1b" stroke-width="1.3" stroke-opacity="1.0"/>
  <text x="771.0" y="275.0" font-size="13" fill="currentColor" text-anchor="middle">Z</text>
  <text x="771.0" y="321.0" font-size="10" fill="currentColor" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" fill-opacity="0.68">N × D</text>
  <text x="20.0" y="386.0" font-size="11" fill="currentColor" text-anchor="start" fill-opacity="0.7">Two layers, one collective — which is exactly the shape of a transformer's feed-forward block.</text>
</svg>
