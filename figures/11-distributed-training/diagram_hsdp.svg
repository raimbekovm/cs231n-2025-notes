  <title id="hsdpTitle">Hybrid sharded data parallelism as a two-dimensional grid</title>
  <desc id="hsdpDesc">Two rows of four GPUs. Each row is one server, boxed, with arrows running left and right between its GPUs marked as fully sharded data parallelism costing about three model sizes of traffic on NVLink at 900 gigabytes per second. Vertical arrows join the two rows, marked as plain data parallelism costing one model size of gradient traffic at 50 gigabytes per second.</desc>
  <text x="20.0" y="28.0" font-size="11.5" fill="#21918c" text-anchor="start" font-weight="600">shard the model this way  →</text>
  <text x="20.0" y="48.0" font-size="11.5" fill="#440154" text-anchor="start" font-weight="600">replicate it this way  ↓</text>
  <rect x="158.0" y="64.0" width="568.0" height="102.0" fill="#21918c" fill-opacity="0.07" stroke="#21918c" stroke-width="1.3" stroke-opacity="1.0" rx="8"/>
