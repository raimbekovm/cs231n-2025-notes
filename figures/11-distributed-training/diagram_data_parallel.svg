  <title id="dpTitle">Data parallelism across three GPUs</title>
  <desc id="dpDesc">Three rows, one per GPU. Each row runs left to right: its own minibatch, a forward pass, a backward pass, and its own local gradient. All three rows then pass through a single shaded all-reduce column, after which each row holds the same averaged gradient and applies the same weight update.</desc>
