  <title id="attnstepTitle">One decoder step: alignment scores, softmax, weighted sum, context vector</title>
  <desc id="attnstepDesc">A column of four encoder states on the left. Each produces an alignment score, and the decoder state below fans a dashed arrow into all four scores. A softmax turns the scores into four weights, which converge on a summation node together with a rail carrying the encoder states themselves. The sum is this step's purple context vector, which enters the recurrent unit alongside the previous decoder state and produces the output token.</desc>
