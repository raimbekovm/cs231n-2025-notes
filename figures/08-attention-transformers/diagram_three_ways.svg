  <title id="threewaysTitle">How information reaches a distant position under recurrence, convolution and attention</title>
  <desc id="threewaysDesc">Three panels, each with a row of five indigo input nodes below a row of five yellow output nodes. In the first the inputs feed a horizontal chain of teal state nodes, so reaching the last output from the first input takes four steps. In the second each output connects only to its three nearest inputs. In the third every output connects to every input, twenty-five edges in one layer.</desc>
