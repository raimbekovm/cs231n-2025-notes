  <title id="tblockTitle">The transformer block: self-attention and a per-vector MLP, each in a residual connection</title>
  <desc id="tblockDesc">Four input vectors enter at the bottom and pass through a full-width multi-head self-attention band, an addition node, and a layer normalization band. Each vector then passes through its own MLP box, a second addition and a second normalization, leaving as four output vectors. Two purple residual paths run up the left margin, one around each sublayer.</desc>
