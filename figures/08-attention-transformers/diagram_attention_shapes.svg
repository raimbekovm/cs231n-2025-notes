  <title id="attnshapesTitle">The attention layer with the shape of every intermediate marked</title>
  <desc id="attnshapesDesc">Query inputs at top left and data inputs below them. Learned projections produce Q, K and V. Q and K meet in a grid of scores of shape NQ by NX, a softmax normalizes each row of that grid into a distribution over inputs, and multiplying by V, carried along a green rail across the bottom, gives one output vector per query.</desc>
