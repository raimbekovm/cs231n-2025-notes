<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 428.0 408.0" width="428.0" height="408.0"
     role="img" aria-labelledby="alignTitle alignDesc" font-family="Source Serif 4, Georgia, serif">
  <title id="alignTitle">A schematic soft alignment between an English sentence and its French translation</title>
  <desc id="alignDesc">A five by five grid of viridis-shaded cells. Source words run across the top and generated words down the left. The bright cells follow the diagonal except where the adjective and the noun exchange places, where the bright band crosses over itself. Neighbouring cells carry a little weight rather than none, so the alignment is soft rather than a hard matching.</desc>
