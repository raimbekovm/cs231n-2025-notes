  <title id="vitTitle">The Vision Transformer: patches to tokens to transformer blocks to class scores</title>
  <desc id="vitDesc">An image on the left is divided by a grid into square patches, one of which is highlighted and enlarged. A linear map turns each flattened patch into a token vector; purple markers below the tokens stand for the positional encodings added to them. The tokens pass through a stack of transformer blocks, the outputs are pooled to a single vector, and a linear layer produces class scores.</desc>
