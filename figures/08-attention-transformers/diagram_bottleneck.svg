  <title id="bottleneckTitle">Sequence-to-sequence with recurrent networks, bottlenecked through one context vector</title>
  <desc id="bottleneckDesc">Four indigo input words feed a chain of four encoder states. The last encoder state produces a single purple context vector c of fixed width. A purple rail carries c to every one of the four decoder states, which chain left to right and emit the translated words above them. No other route connects the source to the output.</desc>
  <text x="440.0" y="24.0" font-size="11.5" fill="currentColor" text-anchor="middle" fill-opacity="0.6">everything the decoder knows about the source passes through c</text>
