  <title id="maskTitle">Masked self-attention: the causal mask before the softmax and the zeros after it</title>
  <desc id="maskDesc">Two four by four grids side by side. In the left grid, rows index the querying position and columns the position being looked at; cells on and below the diagonal hold scores and cells above it hold minus infinity. A softmax turns the left grid into the right one, where the masked cells are exactly zero and the remaining weights in each row are shaded by size and sum to one.</desc>
